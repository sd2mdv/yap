<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Языки программирования</title>
<meta name="description" content="Интерактивный курс «Языки программирования» и «Технологии и методы программирования»: слайды лекций и портал кейсов для студентов.">
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f7; --ink:#111827; --muted:#4b5563; --line:#d8dde8;
  --accent:#1d4ed8; --accent2:#0f766e; --accent-ink:#ffffff; --warn:#b45309; --ok:#15803d; --bad:#b91c1c;
  --A:#1d4ed8; --B:#c2410c; --C:#15803d; --D:#7e22ce;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --k:#93c5fd; --s:#fcd34d; --c:#94a3b8; --n:#f9a8d4; --v:#86efac;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.08);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#121a2e; --surface2:#1a2440; --ink:#eef2ff; --muted:#a5b0c8; --line:#2a3656;
    --accent:#7aa2ff; --accent2:#5eead4; --accent-ink:#0b1020; --warn:#fbbf24; --ok:#4ade80; --bad:#f87171;
    --A:#3b82f6; --B:#f97316; --C:#22c55e; --D:#a855f7;
    --code-bg:#060a16; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --surface2:#1a2440; --ink:#eef2ff; --muted:#a5b0c8; --line:#2a3656;
  --accent:#7aa2ff; --accent2:#5eead4; --accent-ink:#0b1020; --warn:#fbbf24; --ok:#4ade80; --bad:#f87171;
  --A:#3b82f6; --B:#f97316; --C:#22c55e; --D:#a855f7;
  --code-bg:#060a16; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,pre{font-family:var(--mono)}
a{color:var(--accent)}
.hidden{display:none!important}

/* ---------- HOME / COURSE MAP ---------- */
#home{max-width:1240px;margin:0 auto;padding:32px 16px 80px}
.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:28px}
.hero h1{font-size:clamp(28px,4vw,46px);margin:0 0 6px;letter-spacing:-.02em;line-height:1.05}
.hero p{margin:0;color:var(--muted);max-width:760px;line-height:1.5}
.hero .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sem{margin-top:28px}
.sem h2{font-size:22px;margin:0 0 4px}
.sem .meta{color:var(--muted);margin:0 0 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-height:118px;position:relative}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .no{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700}
.tile .tt{font-weight:700;font-size:16.5px;margin:4px 0 6px;line-height:1.25}
.tile .ds{font-size:13.5px;color:var(--muted);line-height:1.4}
.tile .tag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tile .tag.new{background:var(--accent2);color:var(--accent-ink)}
.note-box{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:18px}

/* ---------- PRESENTER ---------- */
#deck{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--surface);border-radius:6px;padding:70px 96px 64px;display:flex;flex-direction:column;overflow:hidden}
.slide .kicker{font-family:var(--mono);color:var(--accent);font-size:22px;font-weight:700;letter-spacing:.02em;margin-bottom:10px;text-transform:uppercase}
.slide h2{font-size:58px;line-height:1.08;margin:0 0 30px;letter-spacing:-.015em}
.slide .body{flex:1;min-height:0;font-size:33px;line-height:1.4}
.slide ul{margin:0;padding-left:1.1em}
.slide li{margin:.28em 0}
.slide li::marker{color:var(--accent)}
.slide li ul{font-size:.86em;margin-top:.15em}
.slide li ul li{margin:.12em 0}
.slide code{background:var(--surface2);padding:.05em .3em;border-radius:6px;font-size:.88em}
.slide b,.slide strong{color:var(--ink)}
.slide .foot{position:absolute;left:96px;right:96px;bottom:22px;display:flex;justify-content:space-between;color:var(--muted);font-size:18px}
.slide .lead{font-size:36px;color:var(--muted);margin:-14px 0 26px;line-height:1.35}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.cols.c3{grid-template-columns:1fr 1fr 1fr;gap:24px}
.card{background:var(--surface2);border-radius:18px;padding:24px 28px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:32px;color:var(--accent)}
.card .body2{font-size:28px;line-height:1.38}
.cols.c3 .card .body2{font-size:25px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:16px;padding:26px 30px;font-size:25px;line-height:1.45;margin:0;overflow:hidden;white-space:pre}
pre.code .k{color:var(--k)} pre.code .s{color:var(--s)} pre.code .c{color:var(--c);font-style:italic} pre.code .n{color:var(--n)} pre.code .v{color:var(--v)}
.code-wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:start}
.code-wrap.full{grid-template-columns:1fr}
.code-note{font-size:28px;line-height:1.4;color:var(--muted)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;margin-top:10px}
.flow .st{flex:1;background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;font-size:27px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.flow .st small{font-weight:400;font-size:21px;color:var(--muted);line-height:1.3}
.flow .st{min-width:0;hyphens:auto;overflow-wrap:break-word}
.flow.many .st{font-size:23px;padding:16px 10px}
.flow.many .st small{font-size:19px}
.flow.many .ar{width:34px;font-size:30px}
.flow .ar{width:54px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:40px;flex:none}
.flow-note{margin-top:30px;font-size:29px;color:var(--muted);line-height:1.4}
table.t{width:100%;border-collapse:collapse;font-size:26px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top;line-height:1.3}
table.t th{color:var(--accent);font-size:23px;text-transform:uppercase;letter-spacing:.03em}
table.t tr:nth-child(even) td{background:var(--surface2)}
.quiz-q{font-size:40px;font-weight:700;line-height:1.25;margin-bottom:26px}
.quiz-o{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.quiz-o .op{display:flex;gap:18px;align-items:center;background:var(--surface2);border:3px solid transparent;border-radius:18px;padding:18px 22px;font-size:29px;line-height:1.3}
.quiz-o .op .L{flex:none;width:58px;height:58px;border-radius:14px;color:#fff;font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center}
.quiz-o .op.right{border-color:var(--ok)}
.quiz-o .op.wrong{opacity:.38}
.quiz-e{margin-top:22px;font-size:27px;color:var(--muted);line-height:1.4}
.La{background:var(--A)} .Lb{background:var(--B)} .Lc{background:var(--C)} .Ld{background:var(--D)}
.hint{font-size:21px;color:var(--muted);margin-top:16px}
.qr-slide{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;flex:1}
.qr-box{background:#fff;padding:22px;border-radius:22px;box-shadow:var(--shadow);line-height:0}
.qr-box canvas,.qr-box img{display:block}
.qr-url{font-family:var(--mono);font-size:24px;color:var(--accent);word-break:break-all;margin-top:18px}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:flex;gap:18px;align-items:flex-start;margin:.45em 0}
.steps li::before{content:counter(s);flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px}
.title-slide{justify-content:center;background:linear-gradient(135deg,var(--surface) 0%,var(--surface) 55%,var(--surface2) 100%)}
.title-slide .big{font-family:var(--mono);font-size:150px;font-weight:800;color:var(--accent);line-height:1;opacity:.95}
.title-slide h1{font-size:76px;line-height:1.05;margin:16px 0 18px;letter-spacing:-.02em;max-width:1300px}
.title-slide .sub{font-size:34px;color:var(--muted);max-width:1250px;line-height:1.35}
.title-slide .by{position:absolute;left:96px;bottom:60px;font-size:24px;color:var(--muted);line-height:1.4}
.pill{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:600;color:var(--muted);margin-right:10px}
.reflect{margin-top:26px;background:var(--surface2);border-left:8px solid var(--accent2);border-radius:12px;padding:18px 24px;font-size:28px;line-height:1.4}
.reflect b{color:var(--accent2)}
.big-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.big-stat .bs{background:var(--surface2);border-radius:18px;padding:22px 26px;border:1px solid var(--line)}
.big-stat .bs .v{font-size:58px;font-weight:800;color:var(--accent);line-height:1.05}
.big-stat .bs .l{font-size:24px;color:var(--muted);margin-top:8px;line-height:1.3}
/* widgets */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.wg label{display:block;font-size:24px;color:var(--muted);margin:6px 0}
.wg input[type=color]{width:120px;height:70px;border:0;background:none;padding:0}
.wg input[type=range]{width:100%}
.ct-prev{border-radius:18px;padding:30px;font-size:40px;font-weight:700;line-height:1.3;border:1px solid var(--line)}
.ct-prev small{display:block;font-size:24px;font-weight:400;margin-top:10px}
.ct-res{font-size:28px;line-height:1.6}
.ok{color:var(--ok);font-weight:700} .bad{color:var(--bad);font-weight:700}
.pal{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.pal .sw{width:150px;border-radius:14px;overflow:hidden;border:1px solid var(--line);font-family:var(--mono);font-size:19px;background:var(--surface)}
.pal .sw div{height:96px}
.pal .sw span{display:block;padding:6px 8px}
.wg select{font-size:24px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* toolbar & overlays */
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;z-index:20;align-items:center}
#deck:hover #bar,#bar:focus-within,#bar.show{opacity:1}
#bar button{border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
#bar button:hover{background:var(--surface2)}
#bar .pos{font-family:var(--mono);font-size:13px;color:var(--muted);padding:0 8px}
#progress{position:fixed;left:0;top:0;height:4px;background:var(--accent);z-index:21;transition:width .2s}
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.72);backdrop-filter:blur(3px)}
.ov .panel{background:var(--surface);color:var(--ink);border-radius:22px;padding:34px 40px;box-shadow:var(--shadow);max-width:min(92vw,1100px);max-height:90vh;overflow:auto;text-align:center}
.ov .panel h3{margin:0 0 12px;font-size:28px}
.timer-big{font-family:var(--mono);font-size:min(28vw,260px);font-weight:800;line-height:1;color:var(--ink)}
.timer-big.end{color:var(--bad)}
.rand-big{font-family:var(--mono);font-size:min(30vw,280px);font-weight:800;line-height:1;color:var(--accent)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#notes{position:fixed;right:12px;top:12px;width:min(520px,44vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;z-index:30;box-shadow:var(--shadow);font-size:15px;line-height:1.5}
#notes h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
#menu .panel{text-align:left;width:min(92vw,1000px)}
#menu .mi{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:16px}
#menu .mi:hover,#menu .mi.cur{background:var(--surface2)}
#menu .mi span{font-family:var(--mono);color:var(--muted);margin-right:10px;font-size:13px}
.black{position:fixed;inset:0;background:#000;z-index:60}
.settings label{display:block;text-align:left;margin:12px 0 4px;font-weight:600}
.settings input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:15px}
.settings p{text-align:left;color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0}
kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:.9em}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;font-size:15px}

/* ---------- STUDENT PORTAL ---------- */
#portal{max-width:720px;margin:0 auto;padding:16px 16px 96px}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}
.p-head>div:last-child{display:flex;gap:6px;flex:none}
.p-head .btn{padding:8px 10px;font-size:14px}
.p-head .brand{font-weight:800;font-size:17px;line-height:1.2}
.p-head .brand small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.p-card h2{font-size:21px;margin:0 0 6px;line-height:1.25}
.p-card h3{font-size:17px;margin:0 0 10px;line-height:1.35}
.p-card p{margin:6px 0;line-height:1.5;color:var(--muted);font-size:15px}
.p-in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:16px}
.p-list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:15px}
.p-list button .no{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px;min-width:52px}
.p-list button .sc{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px;margin:8px 0;font-size:15.5px;line-height:1.4}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}
.p-code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.45;overflow:auto;white-space:pre;margin:8px 0}
.p-code .k{color:var(--k)} .p-code .s{color:var(--s)} .p-code .c{color:var(--c)} .p-code .n{color:var(--n)} .p-code .v{color:var(--v)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14.5px;line-height:1.5}
.fb.good{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok)}
.fb.poor{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad)}
.p-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:8px 12px;margin:4px 4px 0 0;font-size:14.5px}
.chip.used{opacity:.35}
.ord-out{min-height:44px;border:2px dashed var(--line);border-radius:12px;padding:6px;margin:8px 0}
.ord-out .chip{background:var(--surface);border-color:var(--accent)}
.match-row{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0;padding:10px;background:var(--surface2);border-radius:12px}
.match-row select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;width:100%}
.scorebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.scorebar .s{font-family:var(--mono);font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cards button{height:28vh;border:0;border-radius:18px;color:#fff;font-size:64px;font-weight:800}
.fullcard{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42vw;font-weight:800;z-index:50}
.verify{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-align:center;margin:8px 0}
@media (max-width:420px){.cards button{font-size:52px}}
@media print{#bar,#progress{display:none}}
</style>
</head>
<body>
<div id="home" class="hidden"></div>
<div id="deck" class="hidden"><div id="progress"></div><div id="stage"></div>
  <div id="bar">
    <button data-act="home" title="Карта курса (H)">⌂ Курс</button>
    <button data-act="menu" title="Список слайдов (M)">☰</button>
    <button data-act="prev" title="Назад (←)">←</button>
    <span class="pos" id="pos"></span>
    <button data-act="next" title="Вперёд (→)">→</button>
    <button data-act="qr" title="QR портала (Q)">▦ QR</button>
    <button data-act="timer" title="Таймер (T)">⏱ Таймер</button>
    <button data-act="rand" title="Случайный студент (R)">🎲</button>
    <button data-act="notes" title="Заметки лектора (N)">✎</button>
    <button data-act="theme" title="Тема (D)">◐</button>
    <button data-act="full" title="Полный экран (F)">⛶</button>
    <button data-act="help" title="Клавиши (?)">?</button>
  </div>
</div>
<div id="portal" class="hidden"></div>
<div id="notes" class="hidden"></div>
<div id="ovl"></div>

<script>

  /**

   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'

  var qrcode = function(typeNumber, errorCorrectionLevel) {

addLecture({id:"S1L10", sem:1, n:10, title:"Типы данных, переменные и константы", short:"Скалярные и составные типы PHP 8, приведение типов, strict_types, константы", upd:1,

  {t:"Типы данных PHP 8", table:[["Группа","Типы","Пример"],["Скалярные","int, float, string, bool","`42`, `3.14`, `\"abc\"`, `true`"],["Составные","array, object, callable, iterable","`[1,2]`, `new User()`"],["Специальные","null, resource","`null`, дескриптор файла"],["Объявления типов","?int, int|string, mixed, never, void","`function f(?int $x): void`"]], fs:25},
  {t:"Приведение типов: ловушки", code:"var_dump(\"10\" == \"1e1\");   // true  — оба числа 10\nvar_dump(0 == \"a\");         // false в PHP 8 (true в PHP 7!)\nvar_dump(\"abc\" == 0);       // false в PHP 8\nvar_dump(null == false);    // true\nvar_dump(\"1\" === 1);        // false — строгое сравнение", cn:["`==` сравнивает с приведением, `===` — тип и значение","Нестрогое сравнение хешей паролей — известная уязвимость **type juggling**","Правило: всегда `===`"]},
  {t:"Строгий режим", code:"<?php\ndeclare(strict_types=1);\n\nfunction square(int $x): int {\n    return $x * $x;\n}\n\necho square(5);     // 25\necho square(\"5\");   // TypeError в строгом режиме", cn:["Объявления типов — документация и защита","Ошибка видна сразу, а не через месяц в продакшене","Статический анализ: PHPStan, Psalm"]},
  {t:"Константы и перечисления", code:"const MAX_LOGIN_ATTEMPTS = 5;\ndefine('APP_VERSION', '1.0.3');\n\nenum Role: string {          // PHP 8.1\n    case Student = 'student';\n    case Teacher = 'teacher';\n    case Admin   = 'admin';\n}\n$r = Role::from('teacher');  // Role::Teacher", cn:["Константа не меняется во время работы","`enum` исключает «магические строки»","Встроенные: `PHP_VERSION`, `PHP_EOL`, `PHP_INT_MAX`"], fs:24},
  {t:"Вопрос аудитории", quiz:{q:"Что выведет `var_dump(\"1\" === 1);`?", o:["bool(true)","bool(false)","int(1)","Ошибка"], a:1, e:"Строгое сравнение проверяет и тип: строка ≠ целое."}},
  {t:"Область видимости", b:["Переменная внутри функции **локальна** — снаружи её не видно","`global $x` и `$GLOBALS` — плохая практика: скрытые зависимости","`static $count` сохраняет значение между вызовами","Суперглобальные массивы: `$_GET`, `$_POST`, `$_SERVER`, `$_SESSION`, `$_COOKIE`, `$_FILES`","Всё, что в суперглобальных массивах от клиента, — **недоверенные данные**"]}
 ],
 cases:[
  {type:"mc", q:"Что выведет код?", code:"$a = \"5\";\n$b = 5;\nvar_dump($a == $b, $a === $b);", o:["true, true","true, false","false, false","false, true"], a:1, e:"== приводит типы, === нет."},
  {type:"match", q:"Значение → тип PHP:", pairs:[["3.14","float"],["\"3.14\"","string"],["true","bool"],["null","null"]], e:"Кавычки делают значение строкой."},
  {type:"multi", q:"Какие имена переменных допустимы в PHP?", o:["$_count","$2nd","$userName","$user-name"], a:[0,2], e:"После $ — буква или подчёркивание; дефис недопустим."},
  {type:"input", q:"Какую директиву пишут первой строкой, чтобы включить строгую типизацию? (declare(...))", a:["declare(strict_types=1);","declare(strict_types=1)","strict_types=1"], e:"declare(strict_types=1);"},

 ],

addLecture({id:"S2L10", sem:2, n:10, title:"Базы данных для веб-приложений", short:"Реляционная модель, SQL, PostgreSQL, связи, индексы, транзакции, ORM, NoSQL, SQL-инъекции", isNew:1,

  {t:"E2E: Playwright", code:"test('студент видит свои оценки', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('Логин').fill('anna');\n  await page.getByLabel('Пароль').fill(process.env.TEST_PASS);\n  await page.getByRole('button', { name: 'Войти' }).click();\n  await expect(page.getByText('Мои оценки')).toBeVisible();\n});", fs:22, cn:["Настоящий браузер, как пользователь","Хорошо ловит регрессии интерфейса","Медленнее и «хрупче» unit-тестов"]},
  {t:"Анализ безопасности кода", table:[["Метод","Что делает","Инструменты"],["Статический анализ / SAST","ищет ошибки в исходном коде без запуска","PHPStan, Semgrep, PVS-Studio, SVACE"],["SCA","проверяет уязвимые зависимости","composer audit, npm audit, Trivy, OSV"],["DAST","атакует работающее приложение","OWASP ZAP, Burp Suite"],["Фаззинг","подаёт случайные и мутированные данные","AFL++, libFuzzer, Crusher (ИСП РАН)"],["Код-ревью","другой человек читает изменения","pull request"]], fs:23},
  {t:"Вопрос аудитории", quiz:{q:"Какой метод найдёт уязвимость в библиотеке, которую вы подключили через Composer?", o:["E2E-тест","SCA (composer audit)","Ручное тестирование интерфейса","Код-ревью только вашего кода"], a:1, e:"Software Composition Analysis сверяет версии зависимостей с базами уязвимостей (CVE, БДУ ФСТЭК)."}}
 ],

addLecture({id:"S2L14", sem:2, n:14, title:"Git, командная работа и CI/CD", short:"Ветвление, pull request, code review, GitHub Flow, CI/CD-конвейер, GitHub Actions, GitLab CI, DevSecOps", isNew:1,

 slides:[
  {t:"Ветки и слияние", code:"git switch -c feature/grades-export   # новая ветка\n# ... правки ...\ngit add . && git commit -m \"feat: экспорт оценок в CSV\"\ngit push -u origin feature/grades-export\n# → pull request → ревью → merge в main\n\ngit pull --rebase origin main          # подтянуть изменения\n# конфликт? правим файлы, git add, git rebase --continue", fs:23, cn:["main — всегда рабочая версия","Одна задача — одна ветка","Conventional Commits: `feat:`, `fix:`, `docs:`"]},
  {t:"Модели ветвления", table:[["Модель","Суть","Для кого"],["GitHub Flow","main + короткие feature-ветки","веб, частые релизы"],["GitLab Flow","+ ветки окружений (staging, production)","несколько стендов"],["Git Flow","develop, release, hotfix","редкие версионные релизы"],["Trunk-based","маленькие коммиты прямо в main + флаги функций","зрелые команды с хорошими тестами"]], fs:25},
  {t:"Pull request и код-ревью", b:["PR — предложение изменений с описанием и обсуждением","Ревьюер проверяет: логику, читаемость, тесты, **безопасность**","Небольшие PR (до 400 строк) ревьюят качественнее","Правило: минимум 1 одобрение + зелёный CI перед слиянием","Платформы: GitHub, GitLab, GitVerse (СберТех), GitFlic"]},
  {t:"CI/CD-конвейер", flow:[["Commit","push в ветку"],["Build","сборка"],["Test","unit + интеграционные"],["Security","SAST, SCA, секреты"],["Deploy staging","тестовый стенд"],["Deploy prod","после одобрения"]],
   after:"**CI** — непрерывная интеграция: каждый коммит собирается и тестируется. **CD** — непрерывная доставка / развёртывание."},
  {t:"GitHub Actions: пример", code:"name: ci\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: shivammathur/setup-php@v2\n        with: { php-version: '8.4' }\n      - run: composer install --no-progress\n      - run: vendor/bin/phpunit\n      - run: composer audit\n      - uses: gitleaks/gitleaks-action@v2   # поиск секретов", fs:21, cn:["Аналоги: GitLab CI, Jenkins, TeamCity","Конвейер — тоже код: ревью и защита","Секреты — в хранилище секретов CI, не в YAML"]},
  {t:"Вопрос аудитории", quiz:{q:"Вы случайно закоммитили пароль от БД и запушили. Что делать в первую очередь?", o:["Удалить файл новым коммитом","Сменить (отозвать) пароль","Переименовать репозиторий","Ничего, никто не заметит"], a:1, e:"Секрет уже скомпрометирован: история Git и форки его хранят, боты сканируют GitHub за минуты. Сначала ротация, потом чистка истории."}}
 ],
 cases:[
  {type:"order", q:"Путь изменения в GitHub Flow:", items:["Создать ветку","Сделать коммиты","Открыть pull request","Код-ревью и CI","Слить в main"], e:"Короткие ветки и ревью перед слиянием."},
  {type:"match", q:"Префикс Conventional Commits → смысл:", pairs:[["feat:","новая функциональность"],["fix:","исправление ошибки"],["docs:","документация"],["refactor:","переработка без изменения поведения"]], e:"Единый стиль сообщений коммитов."},
  {type:"mc", q:"Что такое CI?", o:["Ручная проверка кода раз в месяц","Автоматическая сборка и тесты при каждом изменении","Шифрование репозитория","Система учёта задач"], a:1, e:"Continuous Integration."},
  {type:"multi", q:"Какие проверки безопасности разумно встроить в CI?", o:["SAST","Проверка зависимостей (SCA)","Поиск секретов в коде","Ручной пентест на каждый коммит"], a:[0,1,2], e:"Ручной пентест — периодически, а не на каждый коммит."},
  {type:"input", q:"Команда Git для создания и переключения на новую ветку feature/x (современный вариант):", a:["git switch -c feature/x","git checkout -b feature/x"], e:"git switch -c feature/x (или git checkout -b)."}

 reflect:"Как изменилась бы ваша командная лабораторная, если бы каждый коммит проверял CI?",

  {t:"Dockerfile для PHP-приложения", code:"FROM php:8.4-fpm-alpine\nRUN docker-php-ext-install pdo_pgsql\nWORKDIR /app\nCOPY composer.json composer.lock ./\nRUN composer install --no-dev --no-scripts\nCOPY . .\nUSER www-data                 # не root!\nEXPOSE 9000\nCMD [\"php-fpm\"]", cn:["**Образ** — шаблон, **контейнер** — запущенный экземпляр","Слои кэшируются: зависимости копируем раньше кода","Минимальный базовый образ — меньше уязвимостей"]},

  {t:"Безопасность контейнеров", b:["Не запускать от **root**, read-only файловая система где возможно","Сканировать образы: Trivy, Grype; подписывать: cosign","Не класть секреты в образ — они остаются в слоях навсегда","Закреплять версии образов (`postgres:17`, а не `latest`)","Не открывать порт БД наружу; сети Compose изолируют сервисы"]},

<script>
"use strict";
/* ======================= УТИЛИТЫ ======================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(s){ // **жирный**, *курсив*, `код`
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(«])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
}
function ls(k, v){ try{ if(v===undefined){ const x=localStorage.getItem(k); return x?JSON.parse(x):null; } localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
const settings = Object.assign({}, CONFIG, ls("yap.settings")||{});
const theme = ls("yap.theme"); if(theme) document.documentElement.dataset.theme = theme;
function toggleTheme(){
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx = cur==="dark"?"light":"dark"; document.documentElement.dataset.theme = nx; ls("yap.theme", nx);
}
const KW = new Set(("echo print function return if else elseif for foreach while do switch case break continue default match fn class new public private protected static const var let true false null array as use namespace require include try catch finally throw interface extends implements int float string bool void def import from in and or not is lambda pass None True False async await export typeof this self yield select insert update delete where join values into create table primary key").split(" "));
function hl(code){
  const re = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|--[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\$[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out="", last=0, m;
  while((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if(m[1] && !(t.startsWith("#") && /[\w"']$/.test(code.slice(0,m.index))) && !(t.startsWith("--") && /\w/.test(code[m.index-1]||""))) out += '<span class="c">'+esc(t)+'</span>';
    else if(m[1]) out += esc(t);
    else if(m[2]) out += '<span class="s">'+esc(t)+'</span>';
    else if(m[3]) out += '<span class="v">'+esc(t)+'</span>';
    else if(m[4]) out += '<span class="n">'+esc(t)+'</span>';
    else out += KW.has(t.toLowerCase()) ? '<span class="k">'+esc(t)+'</span>' : esc(t);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function bullets(arr){
  return "<ul>"+arr.map(x => Array.isArray(x) ? "" : "<li>"+md(x)+subOf(arr,x)+"</li>").join("")+"</ul>";
  function subOf(a, x){ const i=a.indexOf(x); return Array.isArray(a[i+1]) ? bullets(a[i+1]) : ""; }
}
function portalBase(){
  if(settings.portalBase) return settings.portalBase.replace(/#.*$/,"");
  if(/^https?:/.test(location.protocol)) return location.href.split("#")[0];
  return "";
}
function portalUrl(id){ const b = portalBase(); return b ? b + "#p" + (id?"/"+id:"") : ""; }
function qrCanvas(text, px){
  const q = qrcode(0, "M"); q.addData(unescape(encodeURIComponent(text))); q.make();
  const n = q.getModuleCount(), cell = Math.max(2, Math.floor(px / n)), size = cell*n;
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,size,size); g.fillStyle="#000";
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect(k*cell,r*cell,cell,cell);
  return c;
}
function qrHtml(id, px){
  const url = portalUrl(id);
  if(!url) return '<div style="width:'+px+'px;height:'+px+'px;display:flex;align-items:center;justify-content:center;text-align:center;color:#334;font:600 20px/1.4 var(--font);line-height:1.4;padding:20px">Укажите адрес публикации портала:<br>клавиша <kbd>S</kbd> → «Адрес портала»</div>';
  return '<span data-qr="'+esc(url)+'" data-px="'+px+'"></span>';
}
function mountQR(root){ root.querySelectorAll("[data-qr]").forEach(el => { try{ el.replaceWith(qrCanvas(el.dataset.qr, +el.dataset.px)); }catch(e){ el.textContent = "QR: " + el.dataset.qr; } }); }
const LETTERS = ["A","B","C","D","E","F"];
function lecById(id){ return LECTURES.find(l => l.id === id); }
function lecLabel(l){ return l.sem===0 ? "Вводное занятие" : "Семестр "+l.sem+" · Лекция "+l.n; }

/* ======================= СБОРКА СЛАЙДОВ ======================= */
function buildSlides(l){
  const S = [];
  S.push({kind:"title", l});
  if(l.goals) S.push({kind:"goals", l});
  (l.slides||[]).forEach(s => S.push(Object.assign({kind:"content", l}, s)));
  if(l.cases && l.cases.length) S.push({kind:"portal", l});
  if(l.summary) S.push({kind:"summary", l});
  return S;
}
function renderSlide(s, idx, total){
  const l = s.l, foot = '<div class="foot"><span>'+esc(lecLabel(l))+' · '+esc(l.title)+'</span><span>'+(idx+1)+' / '+total+'</span></div>';
  if(s.kind==="title"){
    return '<div class="slide title-slide"><div class="big">'+(l.sem===0?"00":String(l.n).padStart(2,"0"))+'</div><h1>'+md(l.title)+'</h1><div class="sub">'+md(l.sub||"")+'</div>'+
      '<div class="by"><span class="pill">'+esc(lecLabel(l))+'</span>'+(l.isNew?'<span class="pill">новый раздел</span>':'')+'<br><br>'+esc(settings.author)+'<br>'+esc(COURSE.title)+'</div></div>';
  }
  if(s.kind==="goals"){
    return '<div class="slide"><div class="kicker">План занятия</div><h2>Сегодня разберём</h2><div class="body" style="display:grid;grid-template-columns:1fr auto;gap:50px;align-items:start">'+
      '<ol class="steps">'+l.goals.map(g=>"<li>"+md(g)+"</li>").join("")+'</ol>'+
      (l.cases&&l.cases.length?'<div style="text-align:center"><div class="qr-box">'+qrHtml(l.id, 250)+'</div><div class="hint">Портал кейсов лекции<br>откройте заранее</div></div>':'')+
      '</div>'+foot+'</div>';
  }
  if(s.kind==="portal"){
    const url = portalUrl(l.id);
    return '<div class="slide"><div class="kicker">Интерактив · '+l.cases.length+' кейс'+(l.cases.length<5?"а":"ов")+'</div><h2>Портал кейсов: решаем на телефоне</h2><div class="qr-slide">'+
      '<div class="qr-box">'+qrHtml(l.id, 520)+'</div><div class="body"><ol class="steps">'+
      '<li>Наведите камеру на QR-код</li><li>Введите фамилию и группу</li><li>Решите кейсы лекции '+(l.sem===0?"":l.n)+' — проверка мгновенная</li><li>Покажите код подтверждения или отправьте результат</li></ol>'+
      '<div class="qr-url">'+(url?esc(url):"адрес портала не задан — клавиша S")+'</div><div class="hint">Таймер: <kbd>T</kbd> · Полноэкранный QR: <kbd>Q</kbd> · Карточки A/B/C/D для голосования — в портале</div></div></div>'+foot+'</div>';
  }
  if(s.kind==="summary"){
    return '<div class="slide"><div class="kicker">Итоги</div><h2>Что важно запомнить</h2><div class="body">'+bullets(l.summary)+
      (l.reflect?'<div class="reflect"><b>Вопрос для рефлексии:</b> '+md(l.reflect)+'</div>':'')+
      (l.hw?'<div class="reflect" style="border-left-color:var(--accent)"><b style="color:var(--accent)">Задание:</b> '+md(l.hw)+'</div>':'')+
      '</div>'+foot+'</div>';
  }
  // content
  let inner = "";
  if(s.lead) inner += '<div class="lead">'+md(s.lead)+'</div>';
  if(s.b) inner += bullets(s.b);
  if(s.cols) inner += '<div class="cols'+(s.cols.length===3?" c3":"")+'">'+s.cols.map(c=>'<div class="card"><h3>'+md(c.h)+'</h3><div class="body2">'+(c.b?bullets(c.b):md(c.p||""))+'</div></div>').join("")+'</div>';
  if(s.code) inner += '<div class="code-wrap'+(s.cn?"":" full")+'"><pre class="code"'+(s.fs?' style="font-size:'+s.fs+'px"':'')+'>'+hl(s.code)+'</pre>'+(s.cn?'<div class="code-note">'+(Array.isArray(s.cn)?bullets(s.cn):md(s.cn))+'</div>':'')+'</div>';
  if(s.flow) inner += '<div class="flow'+(s.flow.length>5?' many':'')+'">'+s.flow.map((f,i)=>(i?'<div class="ar">→</div>':'')+'<div class="st">'+md(Array.isArray(f)?f[0]:f)+(Array.isArray(f)?'<small>'+md(f[1])+'</small>':'')+'</div>').join("")+'</div>';
  if(s.table) inner += '<table class="t"'+(s.fs?' style="font-size:'+s.fs+'px"':'')+'><tr>'+s.table[0].map(h=>"<th>"+md(h)+"</th>").join("")+'</tr>'+s.table.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+md(c)+"</td>").join("")+"</tr>").join("")+'</table>';
  if(s.stats) inner += '<div class="big-stat">'+s.stats.map(x=>'<div class="bs"><div class="v">'+md(x[0])+'</div><div class="l">'+md(x[1])+'</div></div>').join("")+'</div>';
  if(s.quiz) inner += '<div class="quiz-q">'+md(s.quiz.q)+'</div>'+(s.quiz.code?'<pre class="code" style="font-size:24px;margin-bottom:20px">'+hl(s.quiz.code)+'</pre>':'')+'<div class="quiz-o">'+s.quiz.o.map((o,i)=>'<div class="op" data-i="'+i+'"><span class="L L'+"abcd"[i]+'">'+LETTERS[i]+'</span><span>'+md(o)+'</span></div>').join("")+'</div><div class="quiz-e hidden">'+md(s.quiz.e||"")+'</div><div class="hint">Голосуйте карточками A/B/C/D в портале · <kbd>Пробел</kbd> — показать ответ</div>';

}

/* ---------- виджеты: контраст и палитры ---------- */
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function lum(h){ return hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0); }
function contrast(a,b){ const x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function hsl2hex(h,s,l){ s/=100;l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join(""); }
function contrastWidget(){
  return '<div class="wg" data-w="contrast"><div><label>Цвет текста</label><input type="color" value="#1f2937" data-c="fg"> <label>Цвет фона</label><input type="color" value="#fde68a" data-c="bg">'+
    '<div class="ct-res" data-out></div></div><div class="ct-prev" data-prev>Заголовок интерфейса<small>Обычный текст абзаца: удобно ли его читать с последнего ряда аудитории?</small></div></div>';
}
function paletteWidget(){
  return '<div class="wg" data-w="palette" style="grid-template-columns:.8fr 1.2fr"><div><label>Базовый тон (H): <b data-hv>215</b>°</label><input type="range" min="0" max="359" value="215" data-h>'+
    '<label>Схема гармонии</label><select data-sch><option value="mono">Монохромная</option><option value="comp">Комплементарная</option><option value="ana">Аналоговая</option><option value="tri">Триада</option><option value="split">Расщеплённая комплементарная</option></select>'+
    '<label style="margin-top:14px">Насыщенность: <b data-sv>70</b>%</label><input type="range" min="10" max="100" value="70" data-s></div><div><div class="pal" data-pal></div><div class="hint" data-tip></div></div></div>';
}
function wireWidgets(root){
  root.querySelectorAll('[data-w="contrast"]').forEach(w=>{
    const fg=w.querySelector('[data-c="fg"]'), bg=w.querySelector('[data-c="bg"]'), out=w.querySelector("[data-out]"), pv=w.querySelector("[data-prev]");
    const up=()=>{ const r=contrast(fg.value,bg.value); pv.style.color=fg.value; pv.style.background=bg.value;
      const t=(ok,txt)=>'<span class="'+(ok?"ok":"bad")+'">'+(ok?"✓":"✗")+" "+txt+"</span>";
      out.innerHTML='Контраст: <b>'+r.toFixed(2)+' : 1</b><br>'+t(r>=4.5,"WCAG AA, обычный текст (≥ 4.5)")+'<br>'+t(r>=3,"AA, крупный текст и UI (≥ 3)")+'<br>'+t(r>=7,"AAA, обычный текст (≥ 7)"); };
    fg.oninput=bg.oninput=up; up();
  });
  root.querySelectorAll('[data-w="palette"]').forEach(w=>{
    const h=w.querySelector("[data-h]"), s=w.querySelector("[data-s]"), sch=w.querySelector("[data-sch]"), pal=w.querySelector("[data-pal]"), tip=w.querySelector("[data-tip]");
    const tips={mono:"Один тон, разная светлота: спокойно, строго, легко сделать доступным.",comp:"Противоположные тона: максимальный акцент. Второй цвет — только для CTA и предупреждений.",ana:"Соседние тона: гармонично и мягко, подходит для фонов и иллюстраций.",tri:"Три тона через 120°: ярко; один доминирует, два других — акценты.",split:"Мягче комплементарной: база + два соседа противоположного тона."};
    const up=()=>{ const H=+h.value, Sv=+s.value; w.querySelector("[data-hv]").textContent=H; w.querySelector("[data-sv]").textContent=Sv;
      const hs={mono:[H,H,H,H,H],comp:[H,H,H,(H+180)%360,(H+180)%360],ana:[(H+330)%360,H,(H+30)%360,H,(H+15)%360],tri:[H,H,(H+120)%360,(H+240)%360,H],split:[H,H,(H+150)%360,(H+210)%360,H]}[sch.value];
      const Ls=sch.value==="mono"?[92,75,55,38,22]:[92,55,50,50,25];
      pal.innerHTML=hs.map((hh,i)=>{const hx=hsl2hex(hh,i===0||i===4?Math.min(Sv,30):Sv,Ls[i]);return '<div class="sw"><div style="background:'+hx+'"></div><span>'+hx+'<br>'+["фон","основной","акцент","акцент 2","текст"][i]+'</span></div>';}).join("");
      tip.textContent=tips[sch.value]; };
    h.oninput=s.oninput=sch.onchange=up; up();
  });
}

  const r = P.res[l.id] || (P.res[l.id] = {ans:{}, score:0});
  p.innerHTML = head + '<div class="p-card"><h2>'+esc(l.title)+'</h2><p>'+esc(lecLabel(l))+' · '+l.cases.length+' кейс(ов). Проверка мгновенная; после проверки ответ менять нельзя — думайте до нажатия.</p></div>' + meCard() +
    l.cases.map((c,i)=>caseHtml(l,c,i,r)).join("") +
    '<div class="p-card" id="fin"></div><div class="scorebar"><span>'+esc(P.me.name||"Без имени")+'</span><span class="s" id="sc"></span></div>';
  wireP(p, l); updScore(l);
}
function meCard(){ return '<div class="p-card"><h3>Кто решает</h3><input class="p-in" id="pmN" placeholder="Фамилия Имя" value="'+esc(P.me.name)+'"><div style="height:8px"></div><input class="p-in" id="pmG" placeholder="Группа, например 24-КБ-ИБ1" value="'+esc(P.me.group)+'"></div>'; }
function caseHtml(l,c,i,r){
  const done = r.ans[i]!==undefined; let body = '<h3>'+(i+1)+'. '+md(c.q)+'</h3>'+(c.code?'<div class="p-code">'+hl(c.code)+'</div>':'');
  if(c.type==="mc"||c.type==="multi"){
    body += c.o.map((o,j)=>'<button class="opt" data-o="'+j+'"><span class="L L'+"abcd"[j%4]+'">'+LETTERS[j]+'</span><span>'+md(o)+'</span></button>').join("");
  } else if(c.type==="input"){
    body += '<input class="p-in" data-inp placeholder="'+esc(c.ph||"Ваш ответ")+'" autocomplete="off" autocapitalize="off" spellcheck="false">';
  } else if(c.type==="order"){
    const sh = shuffle(c.items.map((x,j)=>j), l.id+i);
    body += '<p>Нажимайте элементы в правильном порядке:</p><div class="ord-out" data-out></div><div data-pool>'+sh.map(j=>'<button class="chip" data-j="'+j+'">'+md(c.items[j])+'</button>').join("")+'</div>';
  } else if(c.type==="match"){
    const rights = shuffle(c.pairs.map((x,j)=>j), l.id+"m"+i);
    body += c.pairs.map((pr,j)=>'<div class="match-row"><b>'+md(pr[0])+'</b><select data-m="'+j+'"><option value="">— выберите —</option>'+rights.map(k=>'<option value="'+k+'">'+esc(c.pairs[k][1])+'</option>').join("")+'</select></div>').join("");
  }
  body += '<div class="p-actions"><button class="btn primary" data-chk>Проверить</button>'+(c.type==="order"?'<button class="btn" data-reset>Сбросить</button>':'')+'</div><div data-fb></div>';
  return '<div class="p-card" data-case="'+i+'"'+(done?' data-done="1"':'')+'>'+body+'</div>';
}
function shuffle(a, seed){ let s=parseInt(hash32(String(seed)),36)||1; const r=()=>{ s=(s*1103515245+12345)%2147483648; return s/2147483648; }; a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } if(a.length>1&&a.every((v,i)=>v===i)) a.push(a.shift()); return a; }
const norm = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/[\s"'«»;.]+/g," ").trim();
function wireP(p, l){
  p.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>location.hash = "#p"+(b.dataset.pg?"/"+b.dataset.pg:""));
  p.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{ const d=document.createElement("div"); d.className="fullcard"; const i=+b.dataset.card; d.style.background="var(--"+"ABCD"[i]+")"; d.textContent="ABCD"[i]; d.onclick=()=>d.remove(); document.body.appendChild(d); });
  const nm=$("#pmN",p), gr=$("#pmG",p);
  if(nm){ nm.oninput=gr.oninput=()=>{ P.me={name:nm.value.trim(), group:gr.value.trim()}; ls("yap.me",P.me); const sb=p.querySelector(".scorebar span"); if(sb) sb.textContent=P.me.name||"Без имени"; }; }
  if(!l) return;
  const r = P.res[l.id];
  p.querySelectorAll("[data-case]").forEach(card=>{
    const i=+card.dataset.case, c=l.cases[i], sel=new Set(), seq=[];
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(card.dataset.done) return; const j=+b.dataset.o;
      if(c.type==="mc"){ sel.clear(); card.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); }
      if(sel.has(j)){ sel.delete(j); b.classList.remove("sel"); } else { sel.add(j); b.classList.add("sel"); } });
    card.querySelectorAll("[data-pool] .chip").forEach(b=>b.onclick=()=>{ if(card.dataset.done||b.classList.contains("used")) return; seq.push(+b.dataset.j); b.classList.add("used"); card.querySelector("[data-out]").insertAdjacentHTML("beforeend",'<span class="chip">'+seq.length+'. '+md(c.items[+b.dataset.j])+'</span>'); });
    const rs=card.querySelector("[data-reset]"); if(rs) rs.onclick=()=>{ if(card.dataset.done) return; seq.length=0; card.querySelector("[data-out]").innerHTML=""; card.querySelectorAll("[data-pool] .chip").forEach(x=>x.classList.remove("used")); };
    card.querySelector("[data-chk]").onclick=()=>{
      if(card.dataset.done) return;
      let ans, ok;
      if(c.type==="mc"){ if(!sel.size) return; ans=[...sel][0]; ok = ans===c.a; }
      else if(c.type==="multi"){ if(!sel.size) return; ans=[...sel].sort(); ok = JSON.stringify(ans)===JSON.stringify(c.a.slice().sort()); }
      else if(c.type==="input"){ ans=card.querySelector("[data-inp]").value; if(!ans.trim()) return; ok = c.a.includes("*") || c.a.some(x=>norm(x)===norm(ans)); }
      else if(c.type==="order"){ if(seq.length<c.items.length) return; ans=seq.slice(); ok = ans.every((v,k)=>v===k); }
      else if(c.type==="match"){ ans=[...card.querySelectorAll("select")].map(s=>s.value===""?-1:+s.value); if(ans.includes(-1)) return; ok = ans.every((v,k)=>v===k); }
      r.ans[i] = {v:ans, ok}; r.score = Object.values(r.ans).filter(x=>x.ok).length; r.t = Date.now(); saveRes();
      showFb(card, c, r.ans[i]); updScore(l);
    };
    if(r.ans[i]) restore(card, c, r.ans[i]);
  });
}
function restore(card, c, a){
  if(c.type==="mc") card.querySelectorAll(".opt")[a.v]?.classList.add("sel");
  if(c.type==="multi") a.v.forEach(j=>card.querySelectorAll(".opt")[j]?.classList.add("sel"));
  if(c.type==="input") card.querySelector("[data-inp]").value=a.v;
  if(c.type==="order"){ const out=card.querySelector("[data-out]"); a.v.forEach((j,k)=>out.insertAdjacentHTML("beforeend",'<span class="chip">'+(k+1)+'. '+md(c.items[j])+'</span>')); card.querySelectorAll("[data-pool] .chip").forEach(x=>x.classList.add("used")); }
  if(c.type==="match") card.querySelectorAll("select").forEach((s,k)=>s.value=a.v[k]);
  showFb(card, c, a);
}
function showFb(card, c, a){
  card.dataset.done="1";
  card.querySelectorAll("[data-chk],[data-reset]").forEach(b=>b.disabled=true);
  card.querySelectorAll("select,[data-inp]").forEach(x=>x.disabled=true);
  if(c.type==="mc"||c.type==="multi"){ const right = c.type==="mc"?[c.a]:c.a; card.querySelectorAll(".opt").forEach((b,j)=>{ if(right.includes(j)) b.classList.add("right"); else if(b.classList.contains("sel")) b.classList.add("wrong"); }); }
  let extra="";
  if(!a.ok){
    if(c.type==="input"&&!c.a.includes("*")) extra = "Правильный ответ: <b>"+esc(c.a[0])+"</b>. ";
    if(c.type==="order") extra = "Правильный порядок: "+c.items.map((x,k)=>(k+1)+") "+md(x)).join(" → ")+". ";
    if(c.type==="match") extra = "Верные пары: "+c.pairs.map(p=>md(p[0])+" — "+esc(p[1])).join("; ")+". ";
  }
  card.querySelector("[data-fb]").innerHTML = '<div class="fb '+(a.ok?"good":"poor")+'"><b>'+(a.ok?"Верно!":"Не совсем.")+'</b> '+extra+md(c.e||"")+'</div>';
}
function updScore(l){
  const r=P.res[l.id], n=l.cases.length, answered=Object.keys(r.ans).length;
  $("#sc").textContent = r.score+" / "+n+(answered<n?" · осталось "+(n-answered):"");
  const fin=$("#fin");
  if(answered<n){ fin.innerHTML='<h3>Результат</h3><p>Решите все кейсы, чтобы получить код подтверждения.</p>'; return; }
  const code = hash32([P.me.name,P.me.group,l.id,r.score,r.t].join("|"));
  fin.innerHTML = '<h3>Результат: '+r.score+' из '+n+'</h3><p>Код подтверждения (покажите лектору или внесите в отчёт):</p><div class="verify">'+code+'</div><p style="text-align:center">'+esc(P.me.name||"укажите ФИО выше")+' · '+esc(P.me.group||"группа?")+' · '+new Date(r.t).toLocaleString("ru-RU")+'</p>'+
    (settings.collectUrl?'<div class="p-actions"><button class="btn primary" id="send">Отправить результат лектору</button></div><div id="sendSt"></div>':'');
  const sb=$("#send"); if(sb) sb.onclick=()=>{
    if(!P.me.name||!P.me.group){ $("#sendSt").innerHTML='<div class="fb poor">Заполните ФИО и группу в начале страницы.</div>'; return; }
    sb.disabled=true;
    fetch(settings.collectUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:P.me.name,group:P.me.group,lecture:l.id,title:l.title,score:r.score,total:n,code,time:new Date(r.t).toISOString()})})
      .then(()=>{ $("#sendSt").innerHTML='<div class="fb good">Отправлено. Спасибо!</div>'; })
      .catch(()=>{ sb.disabled=false; $("#sendSt").innerHTML='<div class="fb poor">Не удалось отправить — проверьте интернет и попробуйте снова.</div>'; });
  };
}

/* ======================= РОУТИНГ ======================= */
function route(){
  const h = decodeURIComponent(location.hash||"");
  let m;
  if((m = h.match(/^#p(?:\/(.*))?$/))) return showPortal(m[1]||"");
  if((m = h.match(/^#\/([^/]+)(?:\/(\d+))?$/))) return showDeck(m[1], (+m[2]||1)-1);
  showHome();
}
addEventListener("hashchange", route);
route();
</script>
