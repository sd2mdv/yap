<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Языки программирования</title>
<meta name="description" content="Интерактивный курс «Языки программирования» и «Технологии и методы программирования»: слайды, портал кейсов, практические и лабораторные работы, аналитика преподавателя.">
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f7; --ink:#111827; --muted:#4b5563; --line:#d8dde8;
  --accent:#1d4ed8; --accent2:#0f766e; --accent-ink:#ffffff; --warn:#b45309; --ok:#15803d; --bad:#b91c1c;
  --A:#1d4ed8; --B:#c2410c; --C:#15803d; --D:#7e22ce;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --k:#93c5fd; --s:#fcd34d; --c:#94a3b8; --n:#f9a8d4; --v:#86efac;
  --s1:#1d4ed8; --s2:#0f766e; --s3:#c2410c; --s4:#7e22ce; --s5:#be123c; --s6:#4d7c0f;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.08);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#121a2e; --surface2:#1a2440; --ink:#eef2ff; --muted:#a5b0c8; --line:#2a3656;
    --accent:#7aa2ff; --accent2:#5eead4; --accent-ink:#0b1020; --warn:#fbbf24; --ok:#4ade80; --bad:#f87171;
    --A:#3b82f6; --B:#f97316; --C:#22c55e; --D:#a855f7;
    --s1:#7aa2ff; --s2:#5eead4; --s3:#fb923c; --s4:#c084fc; --s5:#fb7185; --s6:#a3e635;
    --code-bg:#060a16; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --surface2:#1a2440; --ink:#eef2ff; --muted:#a5b0c8; --line:#2a3656;
  --accent:#7aa2ff; --accent2:#5eead4; --accent-ink:#0b1020; --warn:#fbbf24; --ok:#4ade80; --bad:#f87171;
  --A:#3b82f6; --B:#f97316; --C:#22c55e; --D:#a855f7;
  --s1:#7aa2ff; --s2:#5eead4; --s3:#fb923c; --s4:#c084fc; --s5:#fb7185; --s6:#a3e635;
  --code-bg:#060a16; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.6}
code,pre{font-family:var(--mono)}
a{color:var(--accent)}
.hidden{display:none!important}
.ic{width:1em;height:1em;vertical-align:-.14em;flex:none;display:inline-block}
.ic-u{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-b{fill:currentColor}
.ic-txt{display:inline-flex;align-items:center;justify-content:center;border-radius:.2em;background:var(--surface2);font-weight:800;font-family:var(--mono);flex:none}

/* ---------- HOME ---------- */
#home{max-width:1240px;margin:0 auto;padding:32px 16px 80px}
.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:clamp(28px,4vw,46px);margin:0 0 6px;letter-spacing:-.02em;line-height:1.05}
.hero p{margin:0;color:var(--muted);max-width:760px;line-height:1.5}
.hero .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.sem{margin-top:28px}
.sem h2{font-size:22px;margin:0 0 4px}
.sem .meta{color:var(--muted);margin:0 0 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 40px;box-shadow:var(--shadow);min-height:132px;position:relative}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .no{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700}
.tile .tt{font-weight:700;font-size:16.5px;margin:4px 0 6px;line-height:1.25}
.tile .ds{font-size:13.5px;color:var(--muted);line-height:1.4}
.tile .tag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tile .tag.new{background:var(--accent2);color:var(--accent-ink)}
.tile .icons{position:absolute;left:16px;bottom:12px;display:flex;gap:8px;font-size:20px;color:var(--muted)}
.tile .cnt{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.note-box{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:14px}
.note-box.okbox{border-style:solid;border-color:var(--ok)}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--surface2);color:var(--muted)}
.status-pill.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* ---------- PRESENTER ---------- */
#deck{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--surface);border-radius:6px;padding:62px 96px 64px;display:flex;flex-direction:column;overflow:hidden}
.slide .kicker{font-family:var(--mono);color:var(--accent);font-size:22px;font-weight:700;letter-spacing:.02em;margin-bottom:10px;text-transform:uppercase;display:flex;gap:12px;align-items:center}
.slide h2{font-size:56px;line-height:1.08;margin:0 0 26px;letter-spacing:-.015em}
.slide .body{flex:1;min-height:0;font-size:32px;line-height:1.4}
.slide ul{margin:0;padding-left:1.1em}
.slide li{margin:.26em 0}
.slide li::marker{color:var(--accent)}
.slide li ul{font-size:.86em;margin-top:.15em}
.slide li.il{list-style:none;margin-left:-1.1em;display:flex;gap:.45em;align-items:flex-start}
.slide li.il>.ic,.slide li.il>.ic-txt{color:var(--accent);margin-top:.18em}
.slide code{background:var(--surface2);padding:.05em .3em;border-radius:6px;font-size:.88em}
.slide .foot{position:absolute;left:96px;right:96px;bottom:22px;display:flex;justify-content:space-between;color:var(--muted);font-size:18px}
.slide .lead{font-size:34px;color:var(--muted);margin:-10px 0 24px;line-height:1.35}
.split{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.split.wr{grid-template-columns:.82fr 1.18fr}
.split.wl{grid-template-columns:1.2fr .8fr}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.cols.c3{grid-template-columns:1fr 1fr 1fr;gap:24px}
.cols.c4{grid-template-columns:1fr 1fr 1fr 1fr;gap:20px}
.card{background:var(--surface2);border-radius:18px;padding:22px 26px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:31px;color:var(--accent);display:flex;gap:12px;align-items:center}
.card h3 .ic{font-size:1.25em}
.card .body2{font-size:27px;line-height:1.38}
.cols.c3 .card .body2,.cols.c4 .card .body2{font-size:24px}
.cols.c4 .card h3{font-size:26px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:16px;padding:24px 28px;font-size:25px;line-height:1.45;margin:0;overflow:hidden;white-space:pre}
.k{color:var(--k)} .s{color:var(--s)} .c{color:var(--c);font-style:italic} .n{color:var(--n)} .v{color:var(--v)}
.code-wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:start}
.code-wrap.full{grid-template-columns:1fr}
.code-note{font-size:27px;line-height:1.4;color:var(--muted)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;margin-top:10px}
.flow .st{flex:1;min-width:0;hyphens:auto;overflow-wrap:break-word;background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;font-size:27px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.flow .st>.ic,.flow .st>.ic-txt{width:58px;height:58px;color:var(--accent)}
.flow .st small{font-weight:400;font-size:21px;color:var(--muted);line-height:1.3}
.flow.many .st{font-size:23px;padding:16px 10px}
.flow.many .st small{font-size:19px}
.flow.many .st>.ic{width:46px;height:46px}
.flow.many .ar{width:34px;font-size:30px}
.flow .ar{width:54px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:40px;flex:none}
.flow-note{margin-top:26px;font-size:28px;color:var(--muted);line-height:1.4}
table.t{width:100%;border-collapse:collapse;font-size:26px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;vertical-align:top;line-height:1.3}
table.t th{color:var(--accent);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
table.t tr:nth-child(even) td{background:var(--surface2)}
table.t td .ic{margin-right:8px;color:var(--accent)}
.quiz-q{font-size:39px;font-weight:700;line-height:1.25;margin-bottom:24px}
.quiz-o{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.quiz-o .op{display:flex;gap:18px;align-items:center;background:var(--surface2);border:3px solid transparent;border-radius:18px;padding:18px 22px;font-size:29px;line-height:1.3;cursor:pointer}
.quiz-o .op .L{flex:none;width:58px;height:58px;border-radius:14px;color:#fff;font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center}
.quiz-o .op.right{border-color:var(--ok)}
.quiz-o .op.wrong{opacity:.38}
.quiz-e{margin-top:20px;font-size:27px;color:var(--muted);line-height:1.4}
.La{background:var(--A)} .Lb{background:var(--B)} .Lc{background:var(--C)} .Ld{background:var(--D)}
.hint{font-size:21px;color:var(--muted);margin-top:14px}
.qr-slide{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;flex:1}
.qr-box{background:#fff;padding:22px;border-radius:22px;box-shadow:var(--shadow);line-height:0;display:inline-block}
.qr-box canvas{display:block}
.qr-url{font-family:var(--mono);font-size:24px;color:var(--accent);word-break:break-all;margin-top:18px}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:flex;gap:18px;align-items:flex-start;margin:.45em 0}
.steps li::before{content:counter(s);flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px}
.title-slide{justify-content:center;background:linear-gradient(135deg,var(--surface) 0%,var(--surface) 55%,var(--surface2) 100%)}
.title-slide .big{font-family:var(--mono);font-size:150px;font-weight:800;color:var(--accent);line-height:1;opacity:.95}
.title-slide h1{font-size:72px;line-height:1.05;margin:16px 0 18px;letter-spacing:-.02em;max-width:1060px}
.title-slide .sub{font-size:33px;color:var(--muted);max-width:1040px;line-height:1.35}
.title-slide .by{position:absolute;left:96px;bottom:56px;font-size:23px;color:var(--muted);line-height:1.4}
.title-slide .deco{position:absolute;right:80px;top:110px;display:grid;grid-template-columns:repeat(2,130px);gap:34px}
.title-slide .deco>*{width:130px;height:130px;color:var(--accent);opacity:.9}
.title-slide .deco>*:nth-child(2),.title-slide .deco>*:nth-child(3){color:var(--accent2)}
.title-slide .deco .ic-txt{font-size:34px}
.pill{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:600;color:var(--muted);margin-right:10px}
.reflect{margin-top:22px;background:var(--surface2);border-left:8px solid var(--accent2);border-radius:12px;padding:16px 24px;font-size:27px;line-height:1.4}
.reflect b{color:var(--accent2)}
.big-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.big-stat .bs{background:var(--surface2);border-radius:18px;padding:22px 26px;border:1px solid var(--line)}
.big-stat .bs .v{font-size:54px;font-weight:800;color:var(--accent);line-height:1.05;display:flex;gap:14px;align-items:center}
.big-stat .bs .l{font-size:24px;color:var(--muted);margin-top:8px;line-height:1.3}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.igrid.dense{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.itile{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.itile>.ic,.itile>.ic-txt{width:72px;height:72px}
.itile>.ic-txt{font-size:26px}
.itile b{font-size:24px;line-height:1.2}
.itile small{font-size:19px;color:var(--muted);line-height:1.25}
.igrid.dense .itile>.ic,.igrid.dense .itile>.ic-txt{width:54px;height:54px}
.igrid.dense b{font-size:21px}
.hero-viz{flex:1;display:grid;grid-template-columns:auto 1fr;gap:70px;align-items:center}
.orb{width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 28%,var(--surface2)),var(--surface2) 70%);display:flex;align-items:center;justify-content:center;position:relative;border:2px solid var(--line)}
.orb>.ic,.orb>.ic-txt{width:190px;height:190px;color:var(--accent)}
.orb .sat{position:absolute;width:92px;height:92px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.orb .sat>.ic,.orb .sat>.ic-txt{width:50px;height:50px;color:var(--accent2)}
.hero-viz .txt{font-size:46px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.hero-viz .txt small{display:block;font-size:30px;font-weight:400;color:var(--muted);margin-top:18px;line-height:1.4}
.tl{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;margin-top:120px}
.tl::before{content:"";position:absolute;left:0;right:0;top:-56px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tl .ev{position:relative;text-align:center}
.tl .ev::before{content:"";position:absolute;left:50%;top:-66px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--surface);border:6px solid var(--accent)}
.tl .ev .y{font-family:var(--mono);font-weight:800;font-size:27px;color:var(--accent);position:absolute;left:0;right:0;top:-118px}
.tl .ev>.ic,.tl .ev>.ic-txt{width:62px;height:62px;margin:0 auto 8px;display:flex}
.tl .ev>.ic-txt{font-size:22px}
.tl .ev b{display:block;font-size:25px;line-height:1.2}
.tl .ev small{display:block;font-size:19px;color:var(--muted);line-height:1.3;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink);font-family:var(--font)}
.chart .ax{stroke:var(--line);stroke-width:2}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:4 6}
.chart .lbl{fill:var(--muted)}
.chart-legend{display:flex;gap:22px;flex-wrap:wrap;font-size:22px;color:var(--muted);margin-top:10px}
.chart-legend i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:8px;vertical-align:-2px}
.chart-cap{font-size:20px;color:var(--muted);margin-top:8px}
.mock{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);font-size:20px;line-height:1.4}
.mock .bar{display:flex;align-items:center;gap:10px;background:var(--surface2);padding:10px 14px;border-bottom:1px solid var(--line)}
.mock .dots{display:flex;gap:7px}.mock .dots i{width:13px;height:13px;border-radius:50%;display:block;background:#ef4444}.mock .dots i:nth-child(2){background:#f59e0b}.mock .dots i:nth-child(3){background:#22c55e}
.mock .url{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-family:var(--mono);font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.mock .url .ic{color:var(--ok)}
.mock .ttl{font-size:17px;color:var(--muted);font-weight:600}
.mock .content{padding:18px 22px;color:var(--ink)}
.mock .content h1,.mock .content h2,.mock .content h3{margin:.2em 0 .4em;line-height:1.2}
.mock .content h1{font-size:30px}.mock .content h2{font-size:26px}.mock .content h3{font-size:22px}
.mock .content p{margin:.4em 0}
.mock .content input,.mock .content select{font:inherit;font-size:18px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:100%;margin:4px 0 10px}
.mock .content button{font-size:18px;padding:8px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
.mock .content .mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mock .content .mcard{background:var(--surface2);border-radius:10px;padding:10px 14px;margin:8px 0}
.mock .content .mnav{display:flex;gap:16px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.mock.term{background:#0b1020;border-color:#1f2a44}
.mock.term .bar{background:#141c33;border-color:#1f2a44}
.mock.term .ttl{color:#94a3b8}
.mock.term pre{margin:0;padding:16px 20px;color:#d1fae5;font-size:20px;line-height:1.45;white-space:pre-wrap;font-family:var(--mono)}
.mock.term pre .pr{color:#7dd3fc}.mock.term pre .cm{color:#64748b}.mock.term pre .er{color:#fca5a5}.mock.term pre .okc{color:#86efac}
.mock.ide{background:#0f172a;border-color:#1e293b}
.mock.ide .bar{background:#111827;border-color:#1e293b}.mock.ide .ttl{color:#94a3b8}
.mock.ide .ide-body{display:grid;grid-template-columns:200px 1fr}
.mock.ide .side{background:#0b1222;border-right:1px solid #1e293b;padding:12px 10px;font-size:16px;color:#94a3b8;font-family:var(--mono)}
.mock.ide .side div{padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock.ide .side div.on{background:#1e293b;color:#e2e8f0}
.mock.ide pre{margin:0;padding:14px 18px;color:#e2e8f0;font-size:19px;line-height:1.5;white-space:pre;overflow:hidden}
.mock.ide pre .ln{display:inline-block;width:1.6em;color:#475569;text-align:right;margin-right:16px}
.mock.ide .status{background:#1d4ed8;color:#fff;font-size:15px;padding:3px 12px;display:flex;gap:18px}
.mock.phone{width:340px;margin:0 auto;border-radius:44px;border:10px solid #1f2937;background:var(--surface)}
.mock.phone .notch{height:28px;display:flex;justify-content:center;align-items:center}
.mock.phone .notch i{width:110px;height:18px;border-radius:12px;background:#1f2937;display:block}
.mock.phone .content{min-height:500px;padding:12px 16px;font-size:18px}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.wg label{display:block;font-size:24px;color:var(--muted);margin:6px 0}
.wg input[type=color]{width:120px;height:70px;border:0;background:none;padding:0}
.wg input[type=range]{width:100%}
.ct-prev{border-radius:18px;padding:30px;font-size:40px;font-weight:700;line-height:1.3;border:1px solid var(--line)}
.ct-prev small{display:block;font-size:24px;font-weight:400;margin-top:10px}
.ct-res{font-size:28px;line-height:1.6}
.ok{color:var(--ok);font-weight:700} .bad{color:var(--bad);font-weight:700}
.pal{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.pal .sw{width:150px;border-radius:14px;overflow:hidden;border:1px solid var(--line);font-family:var(--mono);font-size:19px;background:var(--surface)}
.pal .sw div{height:96px}
.pal .sw span{display:block;padding:6px 8px}
.wg select{font-size:24px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;z-index:20;align-items:center}
#deck:hover #bar,#bar:focus-within,#bar.show{opacity:1}
#bar button{border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
#bar button:hover{background:var(--surface2)}
#bar .pos{font-family:var(--mono);font-size:13px;color:var(--muted);padding:0 8px}
#progress{position:fixed;left:0;top:0;height:4px;background:var(--accent);z-index:21;transition:width .2s}
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.72);backdrop-filter:blur(3px)}
.ov .panel{background:var(--surface);color:var(--ink);border-radius:22px;padding:34px 40px;box-shadow:var(--shadow);max-width:min(92vw,1100px);max-height:90vh;overflow:auto;text-align:center}
.ov .panel h3{margin:0 0 12px;font-size:28px}
.timer-big{font-family:var(--mono);font-size:min(28vw,260px);font-weight:800;line-height:1;color:var(--ink)}
.timer-big.end{color:var(--bad)}
.rand-big{font-family:var(--mono);font-size:min(30vw,280px);font-weight:800;line-height:1;color:var(--accent)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#notes{position:fixed;right:12px;top:12px;width:min(520px,44vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;z-index:30;box-shadow:var(--shadow);font-size:15px;line-height:1.5}
#notes h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
#menu.panel{text-align:left;width:min(92vw,1000px)}
#menu .mi{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:15.5px}
#menu .mi:hover,#menu .mi.cur{background:var(--surface2)}
#menu .mi span{font-family:var(--mono);color:var(--muted);margin-right:10px;font-size:13px}
.black{position:fixed;inset:0;background:#000;z-index:60}
.settings label{display:block;text-align:left;margin:12px 0 4px;font-weight:600}
.settings input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:15px}
.settings p{text-align:left;color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0}
kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:.9em}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;font-size:15px}

/* ---------- STUDENT PORTAL ---------- */
#portal{max-width:880px;margin:0 auto;padding:16px 16px 96px}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}
.p-head>div:last-child{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.p-head .btn{padding:8px 10px;font-size:14px}
.p-head .brand{font-weight:800;font-size:17px;line-height:1.2}
.p-head .brand small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.p-card h2{font-size:21px;margin:0 0 6px;line-height:1.25}
.p-card h3{font-size:17px;margin:0 0 10px;line-height:1.35}
.p-card p{margin:6px 0;line-height:1.5;color:var(--muted);font-size:15px}
.task-text{color:var(--ink);font-size:15.5px;line-height:1.55}
.task-text code{background:var(--surface2);padding:1px 5px;border-radius:5px}
.p-in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:16px;font-family:inherit}
textarea.p-in{min-height:110px;resize:vertical;line-height:1.45}
.p-list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:15px}
.p-list button .no{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px;min-width:62px}
.p-list button .sc{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:99px;font-weight:700;font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px;margin:8px 0;font-size:15.5px;line-height:1.4}
.opt .L{flex:none;width:28px;height:28px;border-radius:8px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}
.p-code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.45;overflow:auto;white-space:pre;margin:8px 0;font-family:var(--mono)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14.5px;line-height:1.5}
.fb.good{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok)}
.fb.poor{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad)}
.fb.info{background:var(--surface2);border:1px solid var(--line)}
.p-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:8px 12px;margin:4px 4px 0 0;font-size:14.5px}
.chip.used{opacity:.35}
.ord-out{min-height:44px;border:2px dashed var(--line);border-radius:12px;padding:6px;margin:8px 0}
.ord-out .chip{background:var(--surface);border-color:var(--accent)}
.match-row{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0;padding:10px;background:var(--surface2);border-radius:12px}
.match-row select,.p-sel{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;width:100%}
.scorebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5;font-size:14.5px}
.scorebar .s{font-family:var(--mono);font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cards button{height:28vh;border:0;border-radius:18px;color:#fff;font-size:64px;font-weight:800}
.fullcard{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42vw;font-weight:800;z-index:50}
.verify{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-align:center;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.editor{display:grid;grid-template-columns:auto 1fr;background:var(--code-bg);border-radius:12px;overflow:hidden;border:1px solid var(--line);font-family:var(--mono);font-size:14px;line-height:1.5}
.editor .gut{padding:10px 8px;color:#64748b;text-align:right;user-select:none;white-space:pre;background:#0b1222;overflow:hidden}
.editor textarea{border:0;outline:0;resize:vertical;min-height:300px;width:100%;background:transparent;color:#e2e8f0;padding:10px 12px;font:inherit;line-height:inherit;white-space:pre;overflow:auto;tab-size:4;caret-color:#fbbf24}
.tests{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tests th,.tests td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-family:var(--mono);word-break:break-word}
.tests th{font-family:var(--font);color:var(--muted);font-size:12px;text-transform:uppercase}
.console{background:#0b1020;color:#cbd5e1;border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:8px}

/* ---------- TEACHER ---------- */
#teacher{max-width:1440px;margin:0 auto;padding:18px 16px 80px}
#teacher h1{font-size:26px;margin:0}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.t-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0 12px}
.t-filters label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:4px;font-weight:600}
.t-filters select,.t-filters input{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14.5px;min-width:150px}
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.t-card h2{font-size:19px;margin:0 0 8px}
.t-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.t-kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.t-kpi .v{font-size:28px;font-weight:800;color:var(--accent);line-height:1.1}
.t-kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.tt{width:100%;border-collapse:collapse;font-size:13.5px}
.tt th,.tt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tt th{background:var(--surface2);font-size:12px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);position:sticky;top:0;z-index:1}
.tt td.c,.tt th.c{text-align:center}
.tt tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tt .y{color:var(--ok);font-weight:700}.tt .nn{color:var(--bad)}
.tscroll{overflow:auto;max-height:72vh;border-radius:10px}
.barcell{display:flex;align-items:center;gap:8px}
.barcell i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.t-split{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:14px;align-items:start}
.wl{max-height:78vh;overflow:auto}
.wl button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:14px;line-height:1.35}
.wl button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.print-only{display:none}
@media (max-width:860px){.t-split{grid-template-columns:1fr}}
@media print{
  #bar,#progress,.no-print,.t-filters,.tabs,.p-head,.scorebar{display:none!important}
  .print-only{display:block}
  :root{--surface:#fff;--surface2:#f1f1f1;--ink:#000;--muted:#333;--line:#999;--accent:#000}
  body{background:#fff;color:#000}
  #teacher{max-width:none;padding:0}
  .t-card{box-shadow:none;border:0;padding:0;margin:8px 0}
  .tscroll{max-height:none;overflow:visible}
  .tt{font-size:10.5px}.tt th{position:static}
  @page{size:A4 landscape;margin:10mm}
}
@media (max-width:420px){.cards button{font-size:52px}}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

addLecture({id:"S1L09", sem:1, n:9, title:"Веб-приложение «Hello world»", short:"Структура веб-приложения, цикл запрос-ответ, первый PHP-сценарий", upd:1,

  {t:"Вопрос аудитории", quiz:{q:"Что увидит пользователь, открыв «Исходный код страницы» PHP-сайта?", o:["Весь PHP-код","Только HTML-результат","Пароль от базы данных","Ничего"], a:1, e:"PHP выполняется на сервере; клиенту уходит только сгенерированный HTML. Поэтому утечка исходников — серьёзный инцидент."}}

addLecture({id:"S1L10", sem:1, n:10, title:"Типы данных, переменные и константы", short:"Скалярные и составные типы PHP 8, приведение типов, strict_types, константы", upd:1,
 sub:"Как PHP хранит значения и почему типизация влияет на безопасность",
 goals:["Переменные в PHP: правила и область видимости","Типы данных PHP 8","Приведение типов и строгий режим","Константы и enum"],
 slides:[
  {t:"Переменные в PHP", code:"$name   = \"Анна\";      // строка\n$age    = 19;          // целое\n$gpa    = 4.7;         // вещественное\n$active = true;        // логическое\n$Name   = \"другая\";    // регистр важен: $name ≠ $Name\n\nvar_dump($age);        // int(19)\necho gettype($gpa);    // double", cn:["Имя начинается с `$`, затем буква или `_`","Тип определяется **значением** — динамическая типизация","`var_dump` — главный друг отладки"]},
  {t:"Типы данных PHP 8", table:[["Группа","Типы","Пример"],["Скалярные","int, float, string, bool","`42`, `3.14`, `\"abc\"`, `true`"],["Составные","array, object, callable, iterable","`[1,2]`, `new User()`"],["Специальные","null, resource","`null`, дескриптор файла"],["Объявления типов","?int, int|string, mixed, never, void","`function f(?int $x): void`"]], fs:25},
  {t:"Приведение типов: ловушки", code:"var_dump(\"10\" == \"1e1\");   // true  — оба числа 10\nvar_dump(0 == \"a\");         // false в PHP 8 (true в PHP 7!)\nvar_dump(\"abc\" == 0);       // false в PHP 8\nvar_dump(null == false);    // true\nvar_dump(\"1\" === 1);        // false — строгое сравнение", cn:["`==` сравнивает с приведением, `===` — тип и значение","Нестрогое сравнение хешей паролей — известная уязвимость **type juggling**","Правило: всегда `===`"]},
  {t:"Строгий режим", code:"<?php\ndeclare(strict_types=1);\n\nfunction square(int $x): int {\n    return $x * $x;\n}\n\necho square(5);     // 25\necho square(\"5\");   // TypeError в строгом режиме", cn:["Объявления типов — документация и защита","Ошибка видна сразу, а не через месяц в продакшене","Статический анализ: PHPStan, Psalm"]},
  {t:"Константы и перечисления", code:"const MAX_LOGIN_ATTEMPTS = 5;\ndefine('APP_VERSION', '1.0.3');\n\nenum Role: string {          // PHP 8.1\n    case Student = 'student';\n    case Teacher = 'teacher';\n    case Admin   = 'admin';\n}\n$r = Role::from('teacher');  // Role::Teacher", cn:["Константа не меняется во время работы","`enum` исключает «магические строки»","Встроенные: `PHP_VERSION`, `PHP_EOL`, `PHP_INT_MAX`"], fs:24},
  {t:"Вопрос аудитории", quiz:{q:"Что выведет `var_dump(\"1\" === 1);`?", o:["bool(true)","bool(false)","int(1)","Ошибка"], a:1, e:"Строгое сравнение проверяет и тип: строка ≠ целое."}},
  {t:"Область видимости", b:["Переменная внутри функции **локальна** — снаружи её не видно","`global $x` и `$GLOBALS` — плохая практика: скрытые зависимости","`static $count` сохраняет значение между вызовами","Суперглобальные массивы: `$_GET`, `$_POST`, `$_SERVER`, `$_SESSION`, `$_COOKIE`, `$_FILES`","Всё, что в суперглобальных массивах от клиента, — **недоверенные данные**"]}
 ],
 cases:[
  {type:"mc", q:"Что выведет код?", code:"$a = \"5\";\n$b = 5;\nvar_dump($a == $b, $a === $b);", o:["true, true","true, false","false, false","false, true"], a:1, e:"== приводит типы, === нет."},
  {type:"match", q:"Значение → тип PHP:", pairs:[["3.14","float"],["\"3.14\"","string"],["true","bool"],["null","null"]], e:"Кавычки делают значение строкой."},
  {type:"multi", q:"Какие имена переменных допустимы в PHP?", o:["$_count","$2nd","$userName","$user-name"], a:[0,2], e:"После $ — буква или подчёркивание; дефис недопустим."},
  {type:"input", q:"Какую директиву пишут первой строкой, чтобы включить строгую типизацию? (declare(...))", a:["declare(strict_types=1);","declare(strict_types=1)","strict_types=1"], e:"declare(strict_types=1);"},
  {type:"mc", q:"Почему сравнение хешей паролей через == опасно?", o:["Это медленно","Строки вида \"0e123…\" при == считаются равными числами","== не работает со строками","Нет никакой опасности"], a:1, e:"\"0e…\" интерпретируется как 0×10^… = 0. Используйте hash_equals() или password_verify()."}

 lab:{ title:"Мини-интерпретатор стековой машины", goal:"Написать интерпретатор постфиксной записи — так работают байт-код JVM и CPython.", fn:"solve", args:["expr"],
  variants:[{op:"^",d:"возведение в степень (a ^ b)",t:[["2 3 ^",8],["2 3 ^ 2 *",16],["3 2 ^ 1 -",8]]},{op:"%",d:"остаток от деления (a % b)",t:[["10 3 %",1],["17 5 % 2 *",4]]},{op:"max",d:"максимум из двух",t:[["3 9 max 2 +",11],["7 -2 max",7]]},{op:"min",d:"минимум из двух",t:[["3 9 min 2 +",5],["7 -2 min",-2]]},{op:"avg",d:"среднее двух чисел",t:[["4 8 avg",6],["1 2 avg 2 *",3]]},{op:"//",d:"целочисленное деление (для неотрицательных чисел)",t:[["7 2 //",3],["20 6 // 1 +",4]]}],
  text:"Выражение `expr` записано в **обратной польской записи**: числа и операции через пробел, операция применяется к двум последним числам в стеке. Поддержите `+ - * /` и дополнительную операцию **`{op}`** — {d}. Верните результат (число). Пример: `\"3 4 + 2 *\"` → 14.",
  tests:v=>[["3 4 +"],["3 4 + 2 *"],["5 1 2 + 4 * + 3 -"],["10 4 /"],["2.5 2 *"],...v.t.map(x=>[x[0]])],
  ref:(v,expr)=>{ const st=[]; for(const t of expr.trim().split(/\s+/)){ if(/^-?\d+(\.\d+)?$/.test(t)){ st.push(+t); continue; } const b=st.pop(), a=st.pop();
    st.push(t==="+"?a+b:t==="-"?a-b:t==="*"?a*b:t==="/"?a/b:t==="^"?Math.pow(a,b):t==="%"?a%b:t==="max"?Math.max(a,b):t==="min"?Math.min(a,b):t==="avg"?(a+b)/2:Math.floor(a/b)); } return st.pop(); },
  hint:"Разбейте строку по пробелам. Число → в стек. Операция → снять b, затем a, положить результат." }
});

  variants:[{f:"gcd",d:"**НОД** чисел `a` и `b` (алгоритм Евклида; НОД(a, 0) = a)"},{f:"lcm",d:"**НОК** чисел `a` и `b` (если одно из них 0 — верните 0)"},{f:"binom",d:"**число сочетаний C(a, b)** — сколькими способами выбрать b из a (если b > a — 0)"},{f:"sum",d:"**сумму всех целых** от min(a, b) до max(a, b) включительно"},{f:"powmod",d:"**остаток от деления a^b на 1000** (a^0 = 1). Внимание: a^b может быть огромным"},{f:"digits",d:"**сумму цифр числа a^b** — для b ≤ 6 (используйте целые числа)"}],
  text:"Числа `a` и `b` — неотрицательные целые. Верните {d}.",
  tests:v=>v.f==="digits"?[[12,3],[7,3],[10,0],[1,1],[20,6],[9,5]]:[[12,18],[7,3],[10,0],[1,1],[20,6],[48,36]],
  ref:(v,a,b)=>{ const g=(x,y)=>y?g(y,x%y):x;
    if(v.f==="gcd") return g(a,b); if(v.f==="lcm") return a&&b?a/g(a,b)*b:0;
    if(v.f==="binom"){ if(b>a) return 0; let r=1; for(let i=1;i<=b;i++) r=r*(a-b+i)/i; return Math.round(r); }
    if(v.f==="sum"){ const lo=Math.min(a,b), hi=Math.max(a,b); return (lo+hi)*(hi-lo+1)/2; }
    if(v.f==="powmod"){ let r=1; for(let i=0;i<b;i++) r=r*a%1000; return r; }
    return [...String(BigInt(a)**BigInt(b))].reduce((s,d)=>s+ +d,0); } }
});

 lab:{ title:"Калькулятор специфичности селектора", goal:"Понять каскад CSS через алгоритм.", fn:"solve", args:["selector"],
  variants:[{f:"arr"},{f:"num"},{f:"arr"},{f:"num"},{f:"str"},{f:"str"}],
  text:v=>"`selector` — простой CSS-селектор без запятых, `:not()` и `::`-псевдоэлементов, например `nav ul li.active > a:hover`. Посчитайте специфичность: **a** — число id (`#x`), **b** — классов (`.x`), атрибутов (`[x]`) и псевдоклассов (`:x`), **c** — типов элементов (`div`). Универсальный селектор `*` и комбинаторы (` `, `>`, `+`, `~`) не считаются. Верните "+(v.f==="arr"?"массив `[a, b, c]`":v.f==="num"?"число `a*100 + b*10 + c`":"строку вида `\"a-b-c\"`, например `\"0-2-3\"`")+".",
  tests:()=>[["p"],["p.note"],["#main p"],["nav ul li.active > a:hover"],["*"],["input[type=\"email\"]:focus"],["#a #b .c div"],["ul > li + li ~ li"]],
  ref:(v,s)=>{ let x=s.replace(/\[[^\]]*\]/g,m=>" .ATTR "); const a=(x.match(/#[\w-]+/g)||[]).length; const b=(x.match(/\.[\w-]+/g)||[]).length+(x.match(/:[\w-]+/g)||[]).length;
    const c=x.replace(/#[\w-]+|\.[\w-]+|:[\w-]+/g," ").split(/[\s>+~]+/).filter(t=>t&&t!=="*"&&/^[a-zA-Z][\w-]*$/.test(t)).length;
    return v.f==="arr"?[a,b,c]:v.f==="num"?a*100+b*10+c:a+"-"+b+"-"+c; } }
});

 lab:{ title:"Контраст по WCAG", goal:"Реализовать формулу относительной яркости и контраста W3C.", fn:"solve", args:["fg","bg"],
  variants:[{r:"ratio"},{r:"aa"},{r:"aaa"},{r:"aaLarge"},{r:"ratio"},{r:"level"}],
  text:v=>"`fg` и `bg` — цвета в формате `#RRGGBB` (регистр любой). Относительная яркость: для каждого канала c = значение / 255; если c ≤ 0.03928, то c / 12.92, иначе ((c + 0.055) / 1.055)^2.4; L = 0.2126·R + 0.7152·G + 0.0722·B. Контраст = (L₁ + 0.05) / (L₂ + 0.05), где L₁ — бо́льшая яркость. "+
    (v.r==="ratio"?"Верните контраст (число; точность проверки — 0.01).":v.r==="aa"?"Верните `true`, если пара проходит **WCAG AA для обычного текста** (≥ 4.5).":v.r==="aaa"?"Верните `true`, если пара проходит **WCAG AAA** (≥ 7).":v.r==="aaLarge"?"Верните `true`, если пара проходит **AA для крупного текста** (≥ 3).":"Верните строку уровня: `\"AAA\"` (≥ 7), `\"AA\"` (≥ 4.5), `\"AA Large\"` (≥ 3) или `\"Fail\"`."),
  tests:()=>[["#000000","#FFFFFF"],["#777777","#ffffff"],["#1d4ed8","#FFFFFF"],["#FFFF00","#FFFFFF"],["#ffffff","#0b1020"],["#B91C1C","#FEF2F2"],["#767676","#FFFFFF"]],
  tol:0.0011,
  ref:(v,a,b)=>{ const L=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255].map(c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}).reduce((s,c,i)=>s+c*[0.2126,0.7152,0.0722][i],0); };
    const x=L(a), y=L(b), r=(Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);
    return v.r==="ratio"?r:v.r==="aa"?r>=4.5:v.r==="aaa"?r>=7:v.r==="aaLarge"?r>=3:r>=7?"AAA":r>=4.5?"AA":r>=3?"AA Large":"Fail"; } }
});

 lab:{ title:"Список дел: обработка команд", goal:"Состояние приложения и его изменение командами — основа любого интерфейса.", fn:"solve", args:["ops"],
  variants:[{out:"titles"},{out:"marks"},{out:"count"},{out:"titles"},{out:"marks"},{out:"count"}],
  text:v=>"`ops` — массив команд-строк: `\"add Текст\"` — добавить задачу в конец; `\"done N\"` — отметить выполненной задачу с номером N (с 1); `\"del N\"` — удалить задачу N (нумерация сдвигается); `\"undo N\"` — снять отметку. Команды с несуществующим номером игнорируйте. "+(v.out==="titles"?"Верните массив **названий невыполненных** задач по порядку.":v.out==="marks"?"Верните массив строк вида `\"[x] Текст\"` для выполненных и `\"[ ] Текст\"` для остальных.":"Верните массив из двух чисел: `[всего задач, выполнено]`."),
  tests:()=>[[["add Купить молоко","add Сдать лабу","done 2","add Позвонить"]],[["add A","add B","add C","del 1","done 1"]],[[]],[["add Один","done 5","del 0","undo 1"]],[["add X","done 1","undo 1","done 1","add Y","del 2"]]],
  ref:(v,ops)=>{ const t=[]; for(const op of ops){ const sp=op.indexOf(" "), c=op.slice(0,sp<0?op.length:sp), a=sp<0?"":op.slice(sp+1);
      if(c==="add") t.push({s:a,d:false}); else { const i=parseInt(a,10)-1; if(!(i>=0&&i<t.length)) continue; if(c==="done") t[i].d=true; else if(c==="undo") t[i].d=false; else if(c==="del") t.splice(i,1); } }
    return v.out==="titles"?t.filter(x=>!x.d).map(x=>x.s):v.out==="marks"?t.map(x=>(x.d?"[x] ":"[ ] ")+x.s):[t.length,t.filter(x=>x.d).length]; } }
});

 lab:{ title:"Линтер Dockerfile", goal:"Автоматически находить опасные практики — как hadolint и Trivy config.", fn:"solve", args:["dockerfile"],
  variants:[{set:["ROOT","LATEST","SECRET"]},{set:["ROOT","LATEST","ADD"]},{set:["LATEST","SECRET","CURLSH"]},{set:["ROOT","SECRET","ADD","CURLSH"]},{set:["ROOT","LATEST","SECRET","ADD"]},{set:["LATEST","ADD","CURLSH"]}],
  text:v=>{ const D={ROOT:"`\"ROOT\"` — нет ни одной инструкции `USER`, или последняя `USER` — `root` или `0`",LATEST:"`\"LATEST\"` — какой-то `FROM` использует образ без тега или с тегом `:latest` (кроме `FROM scratch`)",SECRET:"`\"SECRET\"` — `ENV` или `ARG` задаёт переменную, в имени которой есть `PASSWORD`, `SECRET`, `TOKEN` или `KEY` (без учёта регистра), со значением",ADD:"`\"ADD\"` — используется инструкция `ADD` (лучше `COPY`)",CURLSH:"`\"CURLSH\"` — в `RUN` скачанный скрипт передаётся в оболочку: `curl … | sh` или `wget … | bash` (sh/bash)"};
    return "`dockerfile` — текст Dockerfile (инструкции в верхнем регистре, по одной в строке, строки-комментарии начинаются с `#`). Верните **массив кодов** найденных проблем в порядке: "+v.set.map(k=>D[k]).join("; ")+". Каждый код — не больше одного раза."; },
  tests:()=>[["FROM php:8.4-fpm\nCOPY . /app\nUSER www-data"],["FROM ubuntu\nRUN curl -s https://x.sh | sh\nENV DB_PASSWORD=secret"],["FROM node:latest AS build\nADD . /app\nFROM nginx:1.27\nUSER root"],["# FROM evil:latest\nFROM scratch\nCOPY app /\nUSER 1000"],["FROM python:3.12-slim\nARG API_KEY=abc\nRUN wget -qO- https://get.x | bash\nUSER app\nUSER 0"]],
  ref:(v,df)=>{ const L=df.split("\n").map(s=>s.trim()).filter(s=>s&&!s.startsWith("#")); const out=[];
    for(const k of v.set){ let bad=false;
      if(k==="ROOT"){ const us=L.filter(s=>/^USER\s+/.test(s)); bad=!us.length||/^USER\s+(root|0)\b/.test(us[us.length-1]); }
      if(k==="LATEST") bad=L.some(s=>{ const m=/^FROM\s+(\S+)/.exec(s); if(!m||m[1]==="scratch") return false; const img=m[1].split("@")[0], last=img.split("/").pop(); return !last.includes(":")||/:latest$/.test(img); });
      if(k==="SECRET") bad=L.some(s=>/^(ENV|ARG)\s+\S*(PASSWORD|SECRET|TOKEN|KEY)\S*\s*[= ]\s*\S+/i.test(s));
      if(k==="ADD") bad=L.some(s=>/^ADD\s/.test(s));
      if(k==="CURLSH") bad=L.some(s=>/^RUN\s.*\b(curl|wget)\b.*\|\s*(sh|bash)\b/.test(s));
      if(bad) out.push(k); }
    return out; } }
});

 lab:{ title:"Кэш с вытеснением", goal:"Реализовать политику кэша — как в Redis, браузере и процессоре.", fn:"solve", args:["capacity","keys"],
  variants:[{p:"LRU",r:"hits"},{p:"FIFO",r:"hits"},{p:"LRU",r:"seq"},{p:"FIFO",r:"seq"},{p:"LFU",r:"hits"},{p:"LRU",r:"final"}],
  text:v=>"Кэш вмещает `capacity` ключей. Последовательно приходят запросы `keys`. Если ключ в кэше — попадание (hit), иначе промах (miss): ключ добавляется, а при переполнении вытесняется "+
    ({LRU:"ключ, к которому **дольше всего не обращались** (LRU)",FIFO:"ключ, который был **добавлен раньше всех** (FIFO; попадание порядок не меняет)",LFU:"ключ с **наименьшим числом обращений** (LFU), при равенстве — дольше всех не использовавшийся"})[v.p]+". "+
    (v.r==="hits"?"Верните **число попаданий**.":v.r==="seq"?"Верните строку из букв `H`/`M` по каждому запросу, например `\"MMHM\"`.":"Верните **содержимое кэша** в конце — список ключей от самого «старого» к самому свежему по использованию.")+" capacity ≥ 1.",
  tests:()=>[[2,["a","b","a","c","b","a"]],[3,["1","2","3","1","4","5","2","1"]],[1,["x","x","y","x"]],[2,[]],[3,["a","b","c","a","a","d","b","e","a"]]],
  ref:(v,cap,ks)=>{ let c=[], cnt={}, hits=0, seq=""; for(const k of ks){ const i=c.indexOf(k);
      if(i>=0){ hits++; seq+="H"; cnt[k]++; if(v.p!=="FIFO"){ c.splice(i,1); c.push(k); } }
      else { seq+="M"; if(c.length>=cap){ if(v.p==="LFU"){ let j=0; for(let t=1;t<c.length;t++) if(cnt[c[t]]<cnt[c[j]]) j=t; delete cnt[c[j]]; c.splice(j,1); } else { delete cnt[c[0]]; c.shift(); } } c.push(k); cnt[k]=1; } }
    return v.r==="hits"?hits:v.r==="seq"?seq:c; } }

    ls("yap.outbox", rest);
  }

      '<div class="hint">Можно выполнить лично или в команде. Сдача — в портале, проверка — у преподавателя.</div></div>'+
      '<div style="text-align:center"><div class="qr-box">'+qrHtml(l.id+"/lab", 300)+'</div><div class="hint">Портал → вкладки<br>«Практика» и «Лабораторная»</div></div></div>'+foot+'</div>';

  if(s.icons) inner += iconsHtml(s.icons, s.dense);
  if(s.timeline) inner += timelineHtml(s.timeline);

  if(s.cols) inner += '<div class="cols'+(s.cols.length===3?" c3":s.cols.length===4?" c4":"")+'">'+s.cols.map(c=>'<div class="card"><h3>'+(c.i?ico(c.i):"")+md(c.h)+'</h3><div class="body2">'+(c.b?bullets(c.b):md(c.p||""))+'</div></div>').join("")+'</div>';
  if(s.code) inner += '<div class="code-wrap'+(s.cn?"":" full")+'"><pre class="code"'+(s.fs?' style="font-size:'+s.fs+'px"':'')+'>'+hl(s.code)+'</pre>'+(s.cn?'<div class="code-note">'+(Array.isArray(s.cn)?bullets(s.cn):md(s.cn))+'</div>':'')+'</div>';
  if(s.flow) inner += '<div class="flow'+(s.flow.length>5?' many':'')+'">'+s.flow.map((f,i)=>{ const a = Array.isArray(f)?f:[f];
    return (i?'<div class="ar">→</div>':'')+'<div class="st">'+(a[2]?ico(a[2]):"")+md(a[0])+(a[1]?'<small>'+md(a[1])+'</small>':'')+'</div>'; }).join("")+'</div>';
  if(s.table) inner += '<table class="t"'+(s.fs?' style="font-size:'+s.fs+'px"':'')+'><tr>'+s.table[0].map(h=>"<th>"+md(h)+"</th>").join("")+'</tr>'+s.table.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+md(c)+"</td>").join("")+"</tr>").join("")+'</table>';
  if(s.stats) inner += '<div class="big-stat">'+s.stats.map(x=>'<div class="bs"><div class="v">'+(x[2]?ico(x[2]):"")+md(x[0])+'</div><div class="l">'+md(x[1])+'</div></div>').join("")+'</div>';
  if(s.quiz) inner += '<div class="quiz-q">'+md(s.quiz.q)+'</div>'+(s.quiz.code?'<pre class="code" style="font-size:24px;margin-bottom:20px">'+hl(s.quiz.code)+'</pre>':'')+'<div class="quiz-o">'+s.quiz.o.map((o,i)=>'<div class="op" data-i="'+i+'"><span class="L L'+"abcd"[i]+'">'+LETTERS[i]+'</span><span>'+md(o)+'</span></div>').join("")+'</div><div class="quiz-e hidden">'+md(s.quiz.e||"")+'</div><div class="hint">Голосуйте карточками A/B/C/D в портале · <kbd>Пробел</kbd> — показать ответ</div>';
  if(s.widget==="contrast") inner += contrastWidget();
  if(s.widget==="palette") inner += paletteWidget();
  if(s.after) inner += '<div class="flow-note">'+md(s.after)+'</div>';
  const kick = s.quiz ? ico("vote")+"Вопрос аудитории · голосуем A/B/C/D" : (s.ki?ico(s.ki):"")+esc(s.k || l.title);
  return '<div class="slide"><div class="kicker">'+kick+'</div><h2'+(s.hs?' style="font-size:'+s.hs+'px"':'')+'>'+md(s.t||"")+'</h2><div class="body"'+(s.bs?' style="font-size:'+s.bs+'px"':'')+'>'+inner+'</div>'+foot+'</div>';
}

/* ---------- виджеты: контраст и палитры ---------- */
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function lum(h){ return hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0); }
function contrast(a,b){ const x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function hsl2hex(h,s,l){ s/=100;l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join(""); }
function contrastWidget(){
  return '<div class="wg" data-w="contrast"><div><label>Цвет текста</label><input type="color" value="#1f2937" data-c="fg"> <label>Цвет фона</label><input type="color" value="#fde68a" data-c="bg">'+
    '<div class="ct-res" data-out></div></div><div class="ct-prev" data-prev>Заголовок интерфейса<small>Обычный текст абзаца: удобно ли его читать с последнего ряда аудитории?</small></div></div>';
}
function paletteWidget(){
  return '<div class="wg" data-w="palette" style="grid-template-columns:.8fr 1.2fr"><div><label>Базовый тон (H): <b data-hv>215</b>°</label><input type="range" min="0" max="359" value="215" data-h>'+
    '<label>Схема гармонии</label><select data-sch><option value="mono">Монохромная</option><option value="comp">Комплементарная</option><option value="ana">Аналоговая</option><option value="tri">Триада</option><option value="split">Расщеплённая комплементарная</option></select>'+
    '<label style="margin-top:14px">Насыщенность: <b data-sv>70</b>%</label><input type="range" min="10" max="100" value="70" data-s></div><div><div class="pal" data-pal></div><div class="hint" data-tip></div></div></div>';
}
function wireWidgets(root){
  root.querySelectorAll('[data-w="contrast"]').forEach(w=>{
    const fg=w.querySelector('[data-c="fg"]'), bg=w.querySelector('[data-c="bg"]'), out=w.querySelector("[data-out]"), pv=w.querySelector("[data-prev]");
    const up=()=>{ const r=contrast(fg.value,bg.value); pv.style.color=fg.value; pv.style.background=bg.value;
      const t=(ok,txt)=>'<span class="'+(ok?"ok":"bad")+'">'+(ok?"✓":"✗")+" "+txt+"</span>";
      out.innerHTML='Контраст: <b>'+r.toFixed(2)+' : 1</b><br>'+t(r>=4.5,"WCAG AA, обычный текст (≥ 4.5)")+'<br>'+t(r>=3,"AA, крупный текст и UI (≥ 3)")+'<br>'+t(r>=7,"AAA, обычный текст (≥ 7)"); };
    fg.oninput=bg.oninput=up; up();
  });
  root.querySelectorAll('[data-w="palette"]').forEach(w=>{
    const h=w.querySelector("[data-h]"), s=w.querySelector("[data-s]"), sch=w.querySelector("[data-sch]"), pal=w.querySelector("[data-pal]"), tip=w.querySelector("[data-tip]");
    const tips={mono:"Один тон, разная светлота: спокойно, строго, легко сделать доступным.",comp:"Противоположные тона: максимальный акцент. Второй цвет — только для CTA и предупреждений.",ana:"Соседние тона: гармонично и мягко, подходит для фонов и иллюстраций.",tri:"Три тона через 120°: ярко; один доминирует, два других — акценты.",split:"Мягче комплементарной: база + два соседа противоположного тона."};
    const up=()=>{ const H=+h.value, Sv=+s.value; w.querySelector("[data-hv]").textContent=H; w.querySelector("[data-sv]").textContent=Sv;
      const hs={mono:[H,H,H,H,H],comp:[H,H,H,(H+180)%360,(H+180)%360],ana:[(H+330)%360,H,(H+30)%360,H,(H+15)%360],tri:[H,H,(H+120)%360,(H+240)%360,H],split:[H,H,(H+150)%360,(H+210)%360,H]}[sch.value];
      const Ls=sch.value==="mono"?[92,75,55,38,22]:[92,55,50,50,25];
      pal.innerHTML=hs.map((hh,i)=>{const hx=hsl2hex(hh,i===0||i===4?Math.min(Sv,30):Sv,Ls[i]);return '<div class="sw"><div style="background:'+hx+'"></div><span>'+hx+'<br>'+["фон","основной","акцент","акцент 2","текст"][i]+'</span></div>';}).join("");
      tip.textContent=tips[sch.value]; };
    h.oninput=s.oninput=sch.onchange=up; up();
  });
}

"use strict";
/* ======================= РЕЖИМ ЛЕКТОРА ======================= */
let cur = {l:null, slides:[], i:0};
function fit(){ const st=$("#stage"); const k=Math.min(innerWidth/1600, innerHeight/900); st.style.transform="translate(-50%,-50%) scale("+k+")"; }
function showOnly(id){ ["home","deck","portal","teacher"].forEach(x=>$("#"+x).classList.toggle("hidden", x!==id)); if(id!=="deck") $("#notes").classList.add("hidden"); }
function showDeck(id, i){
  const l = lecById(id); if(!l){ location.hash="#/"; return; }
  if(cur.l!==l){ cur = {l, slides: buildSlides(l), i:0}; }
  cur.i = Math.max(0, Math.min(cur.slides.length-1, i|0));
  showOnly("deck");
  const st=$("#stage"); st.innerHTML = renderSlide(cur.slides[cur.i], cur.i, cur.slides.length);
  mountQR(st); wireWidgets(st); fit();
  $("#pos").textContent = (cur.i+1)+" / "+cur.slides.length;
  $("#progress").style.width = ((cur.i+1)/cur.slides.length*100)+"%";
  const nb=$("#notes"); if(!nb.classList.contains("hidden")) nb.innerHTML = notesHtml();
  document.title = l.title + " — " + lecLabel(l);
}

function revealQuiz(){ const st=$("#stage"); const s=cur.slides[cur.i]; if(!s.quiz) return false; const ops=st.querySelectorAll(".op"); if(!ops.length) return false;
  if(st.querySelector(".op.right")) return false;
  ops.forEach(o=>o.classList.add(+o.dataset.i===s.quiz.a?"right":"wrong")); st.querySelector(".quiz-e").classList.remove("hidden"); return true; }

function overlay(html, onMount){ const o=$("#ovl"); o.innerHTML='<div class="ov">'+html+'</div>'; const ov=o.firstChild; ov.addEventListener("click", e=>{ if(e.target===ov) closeOv(); }); if(onMount) onMount(ov); }

function openQR(path){ const p = path!==undefined ? path : (cur.l ? cur.l.id : ""); const url=portalUrl(p);
  overlay('<div class="panel"><h3>Портал'+(cur.l?" · "+esc(cur.l.title):"")+'</h3><div class="qr-box">'+qrHtml(p, Math.min(innerHeight*0.66, 720)|0)+'</div><div class="qr-url" style="font-size:18px">'+esc(url||"")+'</div></div>', mountQR); }
function openTimer(){

function startTimer(m){ clearInterval(timerT); const tb=$("#tb"); if(!tb) return; let left=m*60; const end=Date.now()+left*1000;
  const draw=()=>{ left=Math.max(0,Math.round((end-Date.now())/1000)); tb.textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0"); tb.classList.toggle("end", left<=10); if(!left) clearInterval(timerT); };
  draw(); if(m) timerT=setInterval(draw, 250); }
