"use strict";
/* ======================= ЗАПУСК КОДА ЛАБОРАТОРНЫХ =======================
   Код студента выполняется только в его браузере, в отдельном потоке (Web Worker):
   JavaScript — встроенный движок, Python — Pyodide (WebAssembly), PHP — php-wasm (WebAssembly).
   Зависший код останавливается по таймауту. Сервер преподавателя чужой код не запускает. */
const LANGS = {
  python:{name:"Python", ico:"python", ext:"py"},
  php:{name:"PHP", ico:"php", ext:"php"},
  js:{name:"JavaScript", ico:"javascript", ext:"js"}
};
function labVariantIndex(lab, seed){ return hash32(lab._id+"|"+seed) % lab.variants.length; }
function labText(lab, v){
  const t = typeof lab.text==="function" ? lab.text(v) : String(lab.text||"");
  return t.replace(/\{(\w+)\}/g, (m,k)=> v[k]!==undefined ? (Array.isArray(v[k])?JSON.stringify(v[k]):String(v[k])) : m);
}
function labTests(lab, v){
  const raw = typeof lab.tests==="function" ? lab.tests(v) : lab.tests;
  return raw.map(args => ({args, expect: lab.ref(v, ...JSON.parse(JSON.stringify(args)))}));
}
function labStub(lab, lang){
  const a = lab.args||[], fn = lab.fn||"solve";
  const doc = (lab.stubDoc||"Ваше решение");
  if(lang==="python") return "def "+fn+"("+a.join(", ")+"):\n    # "+doc+"\n    return None\n";
  if(lang==="php") return "<?php\nfunction "+fn+"("+a.map(x=>"$"+x).join(", ")+") {\n    // "+doc+"\n    return null;\n}\n";
  return "function "+fn+"("+a.join(", ")+") {\n  // "+doc+"\n  return null;\n}\n";
}
function deepEq(a, b, mode, tol){
  tol = tol ?? 1e-6;
  if(mode==="trim" && typeof a==="string" && typeof b==="string") return a.trim().replace(/\r\n/g,"\n")===b.trim().replace(/\r\n/g,"\n");
  if(mode==="ci" && typeof a==="string" && typeof b==="string") return a.trim().toLowerCase()===b.trim().toLowerCase();
  if(typeof a==="number" && typeof b==="number") return Math.abs(a-b) <= tol*Math.max(1,Math.abs(b));
  if(typeof b==="boolean" && (a===0||a===1)) return Boolean(a)===b;
  if(Array.isArray(a) && Array.isArray(b)) return a.length===b.length && a.every((x,i)=>deepEq(x,b[i],mode,tol));
  if(a && b && typeof a==="object" && typeof b==="object"){
    if(Array.isArray(a)!==Array.isArray(b)){ // PHP отдаёт пустой массив как [] вместо {}
      const ea = Array.isArray(a)?a.length===0:Object.keys(a).length===0, eb = Array.isArray(b)?b.length===0:Object.keys(b).length===0; return ea&&eb; }
    const ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
    return ka.length===kb.length && ka.every((k,i)=>k===kb[i] && deepEq(a[k], b[k], mode, tol));
  }
  return a===b;
}
const showVal = v => { try{ const s = JSON.stringify(v); return s===undefined?"undefined":s; }catch(e){ return String(v); } };

/* ---------- исходники потоков ---------- */
const W_JS = `self.onmessage = e => {
  const {code, fn, tests} = e.data; const logs = [];
  const con = {log:(...a)=>logs.push(a.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" "))}; con.error=con.warn=con.info=con.log;
  postMessage({phase:"run"});
  let f;
  try { f = new Function("console", code + "\\n;return typeof "+fn+"==='function' ? "+fn+" : undefined;")(con); }
  catch(err){ postMessage({error:"Ошибка в коде: "+err.message, logs}); return; }
  if(typeof f!=="function"){ postMessage({error:"Функция "+fn+" не найдена", logs}); return; }
  const results = tests.map(a => { try { const v = f(...JSON.parse(JSON.stringify(a))); return {ok:true, v: v===undefined?null:JSON.parse(JSON.stringify(v))}; } catch(err){ return {ok:false, e:String(err && err.message || err)}; } });
  postMessage({results, logs});
};`;
const PY_HARNESS = `
import json
__ns = {"__name__": "__main__"}
__res = None
try:
    exec(compile(__code, "solution.py", "exec"), __ns)
except Exception as __e:
    __res = json.dumps({"error": type(__e).__name__ + ": " + str(__e)}, ensure_ascii=False)
if __res is None:
    __f = __ns.get(__fn)
    if not callable(__f):
        __res = json.dumps({"error": "Функция " + __fn + " не найдена"}, ensure_ascii=False)
    else:
        __out = []
        for __a in json.loads(__tests_json):
            try:
                __out.append({"ok": True, "v": __f(*__a)})
            except Exception as __e:
                __out.append({"ok": False, "e": type(__e).__name__ + ": " + str(__e)})
        __res = json.dumps({"results": __out}, ensure_ascii=False, default=lambda o: sorted(o) if isinstance(o, (set, frozenset)) else str(o))
__res
`;
const W_PY = `let py = null;
self.onmessage = async e => {
  const {code, fn, tests, base, harness} = e.data;
  try {
    if(!py){ postMessage({status:"Загружаю Python (≈10 МБ, только при первом запуске)…"}); importScripts(base + "pyodide.js"); py = await loadPyodide({indexURL: base}); }
    let out = ""; py.setStdout({batched: s => out += s + "\\n"}); py.setStderr({batched: s => out += s + "\\n"});
    py.globals.set("__code", code); py.globals.set("__fn", fn); py.globals.set("__tests_json", JSON.stringify(tests));
    postMessage({phase:"run"});
    const r = JSON.parse(await py.runPythonAsync(harness));
    r.logs = out ? [out] : []; postMessage(r);
  } catch(err){ postMessage({error: String(err && err.message || err), logs: []}); }
};`;
const W_PHP = `const noop = () => {}; const el = () => ({style:{}, appendChild:noop, addEventListener:noop, removeEventListener:noop, setAttribute:noop, getContext:() => null});
self.window = self; // веб-сборке PHP нужен document только для графики — даём заглушку
self.document = {currentScript:null, title:"", hidden:false, visibilityState:"visible", createElement:el, addEventListener:noop, removeEventListener:noop, querySelector:() => null, getElementById:() => null, body:el(), documentElement:el(), styleSheets:[]};
let php = null, used = false, out = "", errt = "";
const txt = d => Array.isArray(d) ? d.join("") : String(d ?? "");
self.onmessage = async e => {
  const {src, url} = e.data;
  try {
    if(!php){ postMessage({status:"Загружаю PHP (≈5 МБ, только при первом запуске)…"}); const m = await import(url); php = new m.PhpWeb();
      php.addEventListener("output", ev => out += txt(ev.detail)); php.addEventListener("error", ev => errt += txt(ev.detail));
      if(php.binary) await php.binary; }
    if(used && php.refresh) await php.refresh(); // сброс: иначе функция solve «уже объявлена»
    used = true; out = ""; errt = ""; postMessage({phase:"run"});
    await php.run(src);
    const i = out.lastIndexOf("@@RESULT@@");
    if(i < 0){ postMessage({error: (errt || out || "PHP не вернул результат").trim().slice(0, 2000), logs: []}); return; }
    const r = JSON.parse(out.slice(i + 10)); const before = (out.slice(0, i) + errt).trim(); r.logs = before ? [before] : []; postMessage(r);
  } catch(err){ postMessage({error: String(err && err.message || err) + (errt ? "\\n" + errt : ""), logs: []}); }
};`;
function phpSource(code, fn, tests){
  const c = String(code).replace(/^\s*<\?php/,"").replace(/\?>\s*$/,"");
  const J = JSON.stringify(tests).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  return "<?php\n" + c + "\n;\n$__t = json_decode('"+J+"', true); $__o = [];\n" +
    "if(!function_exists('"+fn+"')){ echo \"@@RESULT@@\".json_encode([\"error\"=>\"Функция "+fn+" не найдена\"], JSON_UNESCAPED_UNICODE); }\n" +
    "else { foreach($__t as $__a){ try { $__o[] = [\"ok\"=>true, \"v\"=>"+fn+"(...$__a)]; } catch(\\Throwable $__e){ $__o[] = [\"ok\"=>false, \"e\"=>get_class($__e).\": \".$__e->getMessage()]; } }\n" +
    "echo \"@@RESULT@@\".json_encode([\"results\"=>$__o], JSON_UNESCAPED_UNICODE|JSON_PRESERVE_ZERO_FRACTION|JSON_PARTIAL_OUTPUT_ON_ERROR); }\n";
}
const Runner = {
  w:{},
  make(lang){
    const src = lang==="js"?W_JS:lang==="python"?W_PY:W_PHP;
    const url = URL.createObjectURL(new Blob([src], {type:"text/javascript"}));
    return new Worker(url, lang==="php"?{type:"module"}:undefined);
  },
  run(lang, code, fn, tests, onStatus){
    return new Promise(resolve=>{
      let w = this.w[lang] || (this.w[lang] = this.make(lang));
      let timer = null; const limit = lang==="js"?4000:10000;
      const done = r => { clearTimeout(timer); w.onmessage = null; w.onerror = null; resolve(r); };
      const kill = msg => { try{ w.terminate(); }catch(e){} delete this.w[lang]; done({error:msg, logs:[]}); };
      timer = setTimeout(()=>kill("Среда не загрузилась за 2 минуты — проверьте интернет"), 120000);
      w.onmessage = e => { const d = e.data;
        if(d.status){ onStatus && onStatus(d.status); return; }
        if(d.phase==="run"){ clearTimeout(timer); timer = setTimeout(()=>kill("Превышено время выполнения ("+limit/1000+" с) — возможно, бесконечный цикл"), limit); return; }
        done(d); };
      w.onerror = e => { e.preventDefault && e.preventDefault(); kill("Ошибка среды выполнения: "+(e.message||"неизвестно")); };
      const args = tests.map(t=>t.args);
      if(lang==="js") w.postMessage({code, fn, tests:args});
      else if(lang==="python") w.postMessage({code, fn, tests:args, base:settings.pyodide, harness:PY_HARNESS});
      else w.postMessage({src: phpSource(code, fn, args), url:settings.phpwasm});
    });
  }
};
/* Полная проверка: статические правила + тесты. Возвращает {passed,total,rows,error,logs,static} */
async function checkLab(lab, v, lang, code, onStatus){
  const tests = labTests(lab, v), st = [];
  for(const f of (lab.forbid||[])){ const re = new RegExp(f.re||f, "i"); if(re.test(code)) st.push("Запрещено использовать: "+(f.msg||f)); }
  for(const r of (lab.require||[])){ if(r.lang && r.lang!==lang) continue; const re = new RegExp(r.re, "i"); if(!re.test(code)) st.push("Требование не выполнено: "+r.msg); }
  const r = await Runner.run(lang, code, lab.fn||"solve", tests, onStatus);
  const rows = tests.map((t,i)=>{ const g = r.results && r.results[i]; const ok = !!(g && g.ok && deepEq(g.v, t.expect, lab.cmp, lab.tol));
    return {args:t.args, expect:t.expect, got: g ? (g.ok ? g.v : undefined) : undefined, err: g && !g.ok ? g.e : null, ok}; });
  const passed = r.error ? 0 : rows.filter(x=>x.ok).length;
  return {passed: st.length ? 0 : passed, rawPassed: passed, total: tests.length, rows, error: r.error||null, logs: r.logs||[], static: st};
}
function testsTable(res){
  if(res.error) return '<div class="fb poor"><b>Ошибка:</b> <pre style="white-space:pre-wrap;margin:6px 0 0;font-family:var(--mono);font-size:13px">'+esc(res.error)+'</pre></div>';
  return (res.static&&res.static.length?'<div class="fb poor">'+res.static.map(esc).join("<br>")+'</div>':"")+
    '<table class="tests"><tr><th>#</th><th>Аргументы</th><th>Ожидается</th><th>Получено</th><th></th></tr>'+res.rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(showVal(r.args).slice(1,-1))+'</td><td>'+esc(showVal(r.expect))+'</td><td>'+(r.err?'<span class="bad">'+esc(r.err)+'</span>':esc(showVal(r.got)))+'</td><td class="r">'+(r.ok?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+'</td></tr>').join("")+'</table>'+
    (res.logs&&res.logs.length?'<div class="console">'+esc(res.logs.join("\n").slice(0,3000))+'</div>':"");
}

  if(id==="me"){ renderMine(p); wireNav(); return; }
  const l = id ? lecById(id) : null;
  if(!l){
    p.innerHTML = portalHead() + meCard() + '<div class="p-card"><h2>Лекции</h2><p>Обычно QR-код на слайде сразу открывает нужную лекцию.</p>'+
      COURSE.sems.map(s=>'<h3 style="margin-top:14px">'+esc(s.title)+'</h3><div class="p-list">'+LECTURES.filter(x=>x.sem===s.n).map(lecRow).join("")+'</div>').join("")+
      '<h3 style="margin-top:14px">Вводное</h3><div class="p-list">'+LECTURES.filter(x=>x.sem===0).map(lecRow).join("")+'</div></div>';
    wireNav(); wireMe(p); return;
  }
  document.title = l.title + " — портал";
  const tabs = [["cases","Кейсы","vote",l.cases&&l.cases.length],["practice","Практика","pencil",!!l.practice],["lab","Лабораторная","code",!!l.lab]].filter(t=>t[3]);
  const cur = tabs.find(t=>t[0]===tab) ? tab : (tabs[0]||["cases"])[0];
  p.innerHTML = portalHead() + '<div class="p-card"><h2>'+esc(l.title)+'</h2><p>'+esc(lecLabel(l))+'</p></div>' + meCard(cur==="cases") +
    '<div class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(t[0]===cur?"on":"")+'">'+ico(t[2])+esc(t[1])+'</button>').join("")+'</div><div id="ptab"></div>';
  wireNav();
  p.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ history.replaceState(null,"","#p/"+l.id+"/"+b.dataset.tab); showPortal(l.id+"/"+b.dataset.tab); });
  wireMe(p, ()=>{ checkin(l); if(cur==="lab") renderLab(l); });
  checkin(l);
  if(cur==="cases") renderCases(l); else if(cur==="practice") renderPractice(l); else renderLab(l);
}
function lecRow(x){
  const r=P.res[x.id], pr=P.prac[x.id], lb=P.labs[x.id];
  const marks = [r&&x.cases?("кейсы "+r.score+"/"+x.cases.length):"", pr&&pr.sent?"практика ✓":"", lb&&lb.sent?"лаба "+lb.sent.passed+"/"+lb.sent.total:""].filter(Boolean).join(" · ");

/* ---------- общий движок заданий (кейсы и автопроверяемые задачи практики) ---------- */
function taskHtml(c, i, seedKey){
  let body = '<h3>'+(i+1)+'. '+md(c.q)+'</h3>'+(c.code?'<div class="p-code">'+hl(c.code)+'</div>':'');
  if(c.type==="mc"||c.type==="multi") body += (c.type==="multi"?'<p>Выберите все верные варианты.</p>':'')+c.o.map((o,j)=>'<button class="opt" data-o="'+j+'"><span class="L L'+"abcd"[j%4]+'">'+LETTERS[j]+'</span><span>'+md(o)+'</span></button>').join("");
  else if(c.type==="input") body += '<input class="p-in" data-inp placeholder="'+esc(c.ph||"Ваш ответ")+'" autocomplete="off" autocapitalize="off" spellcheck="false">';
  else if(c.type==="order"){ const sh = shuffle(c.items.map((x,j)=>j), seedKey+i); body += '<p>Нажимайте элементы в правильном порядке:</p><div class="ord-out" data-out></div><div data-pool>'+sh.map(j=>'<button class="chip" data-j="'+j+'">'+md(c.items[j])+'</button>').join("")+'</div>'; }
  else if(c.type==="match"){ const rights = shuffle(c.pairs.map((x,j)=>j), seedKey+"m"+i); body += c.pairs.map((pr,j)=>'<div class="match-row"><b>'+md(pr[0])+'</b><select data-m="'+j+'"><option value="">— выберите —</option>'+rights.map(k=>'<option value="'+k+'">'+esc(c.pairs[k][1])+'</option>').join("")+'</select></div>').join(""); }
  else if(c.type==="open"){ body += '<textarea class="p-in" data-open placeholder="'+esc(c.ph||"Развёрнутый ответ")+'"></textarea>'+(c.hint?'<p>Подсказка: '+md(c.hint)+'</p>':'')+'<p>Ответ проверит преподаватель.</p>'; return '<div class="p-card" data-task="'+i+'">'+body+'</div>'; }
  body += '<div class="p-actions"><button class="btn primary" data-chk>Проверить</button>'+(c.type==="order"?'<button class="btn" data-reset>Сбросить</button>':'')+'</div><div data-fb></div>';
  return '<div class="p-card" data-task="'+i+'">'+body+'</div>';
}
function wireTask(card, c, stored, onCheck){
  const sel=new Set(), seq=[];
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(card.dataset.done) return; const j=+b.dataset.o;
    if(c.type==="mc"){ sel.clear(); card.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); }
    if(sel.has(j)){ sel.delete(j); b.classList.remove("sel"); } else { sel.add(j); b.classList.add("sel"); } });
  card.querySelectorAll("[data-pool] .chip").forEach(b=>b.onclick=()=>{ if(card.dataset.done||b.classList.contains("used")) return; seq.push(+b.dataset.j); b.classList.add("used"); card.querySelector("[data-out]").insertAdjacentHTML("beforeend",'<span class="chip">'+seq.length+'. '+md(c.items[+b.dataset.j])+'</span>'); });
  const rs=card.querySelector("[data-reset]"); if(rs) rs.onclick=()=>{ if(card.dataset.done) return; seq.length=0; card.querySelector("[data-out]").innerHTML=""; card.querySelectorAll("[data-pool] .chip").forEach(x=>x.classList.remove("used")); };
  const chk = card.querySelector("[data-chk]");
  if(chk) chk.onclick=()=>{
    if(card.dataset.done) return;
    let v, ok;
    if(c.type==="mc"){ if(!sel.size) return; v=[...sel][0]; ok = v===c.a; }
    else if(c.type==="multi"){ if(!sel.size) return; v=[...sel].sort(); ok = JSON.stringify(v)===JSON.stringify(c.a.slice().sort()); }
    else if(c.type==="input"){ v=card.querySelector("[data-inp]").value; if(!v.trim()) return; ok = c.a.includes("*") || c.a.some(x=>norm(x)===norm(v)); }
    else if(c.type==="order"){ if(seq.length<c.items.length) return; v=seq.slice(); ok = v.every((x,k)=>x===k); }
    else if(c.type==="match"){ v=[...card.querySelectorAll("select")].map(s=>s.value===""?-1:+s.value); if(v.includes(-1)) return; ok = v.every((x,k)=>x===k); }
    const a = {v, ok}; showTaskFb(card, c, a); onCheck(a);
  };
  if(stored) restoreTask(card, c, stored);
}
function restoreTask(card, c, a){
  if(c.type==="mc") card.querySelectorAll(".opt")[a.v]?.classList.add("sel");
  if(c.type==="multi") a.v.forEach(j=>card.querySelectorAll(".opt")[j]?.classList.add("sel"));
  if(c.type==="input") card.querySelector("[data-inp]").value=a.v;
  if(c.type==="order"){ const out=card.querySelector("[data-out]"); a.v.forEach((j,k)=>out.insertAdjacentHTML("beforeend",'<span class="chip">'+(k+1)+'. '+md(c.items[j])+'</span>')); card.querySelectorAll("[data-pool] .chip").forEach(x=>x.classList.add("used")); }
  if(c.type==="match") card.querySelectorAll("select").forEach((s,k)=>s.value=a.v[k]);
  showTaskFb(card, c, a);
}
function showTaskFb(card, c, a){
  card.dataset.done="1";
  card.querySelectorAll("[data-chk],[data-reset]").forEach(b=>b.disabled=true);
  card.querySelectorAll("select,[data-inp]").forEach(x=>x.disabled=true);
  if(c.type==="mc"||c.type==="multi"){ const right = c.type==="mc"?[c.a]:c.a; card.querySelectorAll(".opt").forEach((b,j)=>{ if(right.includes(j)) b.classList.add("right"); else if(b.classList.contains("sel")) b.classList.add("wrong"); }); }
  let extra="";
  if(!a.ok){
    if(c.type==="input"&&!c.a.includes("*")) extra = "Правильный ответ: <b>"+esc(c.a[0])+"</b>. ";
    if(c.type==="order") extra = "Правильный порядок: "+c.items.map((x,k)=>(k+1)+") "+md(x)).join(" → ")+". ";
    if(c.type==="match") extra = "Верные пары: "+c.pairs.map(p=>md(p[0])+" — "+esc(p[1])).join("; ")+". ";
  }
  card.querySelector("[data-fb]").innerHTML = '<div class="fb '+(a.ok?"good":"poor")+'"><b>'+(a.ok?"Верно!":"Не совсем.")+'</b> '+extra+md(c.e||"")+'</div>';
}

/* ---------- кейсы ---------- */
function renderCases(l){
  const box = $("#ptab");
  const r = P.res[l.id] || (P.res[l.id] = {ans:{}, score:0});
  box.innerHTML = '<div class="p-card"><p>'+l.cases.length+' кейс(ов). Проверка мгновенная; после проверки ответ менять нельзя — думайте до нажатия.</p></div>'+
    l.cases.map((c,i)=>taskHtml(c,i,l.id)).join("") + '<div class="p-card" id="fin"></div><div class="scorebar"><span id="sbn">'+esc(P.me.name||"Без имени")+'</span><span class="s" id="sc"></span></div>';
  box.querySelectorAll("[data-task]").forEach(card=>{ const i=+card.dataset.task, c=l.cases[i];
    wireTask(card, c, r.ans[i], a=>{
      if(!meOk()){ alert("Укажите фамилию, имя и группу вверху страницы — иначе результат не попадёт к преподавателю."); }
      r.ans[i]=a; r.score=Object.values(r.ans).filter(x=>x.ok).length; r.t=Date.now(); saveP();
      sendEv("case", l.id, {i, ok:a.ok, v:a.v});
      updCases(l, true);
    });
  });
  updCases(l, false);
}
function updCases(l, justChecked){
  const r=P.res[l.id], n=l.cases.length, answered=Object.keys(r.ans).length;
  $("#sc").textContent = r.score+" / "+n+(answered<n?" · осталось "+(n-answered):"");
  const fin=$("#fin");
  if(answered<n){ fin.innerHTML='<h3>Результат</h3><p>Решите все кейсы, чтобы получить код подтверждения.</p>'; return; }
  const code = hashCode([norm(P.me.name),normGroup(P.me.group),l.id,r.score,r.t].join("|"));
  if(justChecked && !r.sentDone){ r.sentDone = true; saveP(); sendEv("cases", l.id, {score:r.score, total:n, code}); }
  fin.innerHTML = '<h3>Результат: '+r.score+' из '+n+'</h3><p>Код подтверждения:</p><div class="verify">'+code+'</div><p style="text-align:center">'+esc(P.me.name||"укажите ФИО")+' · '+esc(P.me.group||"группа?")+' · '+new Date(r.t).toLocaleString("ru-RU")+'</p>'+
    '<div class="fb '+(API.mode==="server"?"good":"info")+'">'+(API.mode==="server"?"Результат автоматически отправлен преподавателю.":"Сервер преподавателя не найден: результат сохранён на этом устройстве. Покажите код преподавателю.")+'</div>';
}

    P0.tasks.map((c,i)=>taskHtml(c,i,l.id+"p")).join("")+

  });
  $("#prSend").onclick = async ()=>{

    if(miss && !confirm("Не выполнено задач: "+miss+". Сдать как есть?")) return;

    const answers = P0.tasks.map((c,i)=> c.type==="open" ? {open:(st.open[i]||"").slice(0,5000)} : (st.ans[i]||null));
    const r = await sendEv("practice", l.id, {auto:{score, total:auto.length}, answers});

    updPrac(l);
  };
  updPrac(l);
}
function updPrac(l){
  const P0=l.practice, st=P.prac[l.id]; const auto=P0.tasks.filter(c=>c.type!=="open").length;
  const done=P0.tasks.filter((c,i)=>c.type==="open"?(st.open[i]||"").trim():st.ans[i]).length, ok=P0.tasks.filter((c,i)=>c.type!=="open"&&st.ans[i]&&st.ans[i].ok).length;
  $("#prSum").innerHTML = '<p>Выполнено '+done+' из '+P0.tasks.length+' · автопроверка: '+ok+' из '+auto+(st.sent?' · <span class="badge ok">сдано '+fmtDate(st.sent.t)+'</span>':'')+(P0.tasks.length>auto?' · развёрнутых ответов: '+(P0.tasks.length-auto):'')+'</p>';
}

    (lab.hint?'<p>Подсказка: '+md(lab.hint)+'</p>':'')+'</div>'+

  const ta = $("#lbCode"), gut = $("#lbGut");
  ta.value = code;

  ta.addEventListener("input", ()=>{ st.code[st.lang]=ta.value; saveP(); lines(); });

    if(e.key==="Tab"){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
    else if(e.key==="Enter"){ const s=ta.selectionStart, before=ta.value.slice(0,s), lineStart=before.lastIndexOf("\n")+1, ind=(before.slice(lineStart).match(/^\s*/)||[""])[0], extra=/[:{(\[]\s*$/.test(before)?"    ":"";
      e.preventDefault(); ta.setRangeText("\n"+ind+extra, s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }

  $("#lbReset").onclick=()=>{ if(!confirm("Заменить код шаблоном?")) return; delete st.code[st.lang]; saveP(); renderLab(l); };
  const run = async ()=>{
    $("#lbRun").disabled = true; $("#lbStatus").innerHTML = '<div class="fb info">Выполняю…</div>';

}

    (rows?'<div class="tscroll"><table class="tt"><tr><th>№</th><th>Лекция</th><th class="c">Кейсы</th><th class="c">Практика</th><th class="c">Лаба</th></tr>'+rows+'</table></div>':'<p>Пока нет результатов.</p>');
}

async function loadTeacher(){

/* ---------- модель данных ---------- */
function buildModel(events, grades){
  const M = { students:new Map(), present:new Map(), cases:new Map(), works:[], gradeOf:new Map(), groups:new Set() };
  const stu = (name, group) => { const k = stuKey(name, group); if(!M.students.has(k)) M.students.set(k, {k, name:normName(name), group:normGroup(group)}); M.groups.add(normGroup(group)); return k; };
  const mapOf = (m, k) => m.get(k) || (m.set(k, new Map()), m.get(k));
  for(const g of grades) M.gradeOf.set(g.ref, g); // последняя оценка побеждает
  const sorted = events.slice().sort((a,b)=>(a.t||a.ct||0)-(b.t||b.ct||0));
  for(const e of sorted){
    if(!e.name || !e.group || !e.lecture) continue;
    const k = stu(e.name, e.group), t = e.t||e.ct;
    const pr = mapOf(M.present, e.lecture); if(!pr.has(k)) pr.set(k, t);
    if(e.kind==="case"){ const c = mapOf(M.cases, e.lecture); const s = c.get(k) || (c.set(k,{ans:{}}), c.get(k)); if(!(e.i in s.ans)) s.ans[e.i] = {ok:!!e.ok, v:e.v}; }
    if(e.kind==="practice"||e.kind==="lab"){ (e.members||[e.name]).forEach(n=>stu(n, e.group)); M.works.push(e); }
  }
  // последняя попытка каждого автора по каждой работе
  const last = new Map();
  for(const w of M.works){ const key = w.lecture+"|"+w.kind+"|"+(w.team?("team:"+norm(w.team)+"|"+normGroup(w.group)):stuKey(w.name,w.group)); const prev = last.get(key); w.attempt = prev ? prev.attempt+1 : 1; last.set(key, w); }
  M.lastWorks = [...last.values()];
  // работа, засчитанная каждому студенту: {lec|kind|stuKey -> work}
  M.workOf = new Map();
  for(const w of M.lastWorks) for(const n of (w.members||[w.name])) M.workOf.set(w.lecture+"|"+w.kind+"|"+stuKey(n, w.group), w);
  return M;
}
const gradeNum = g => g==="зачтено"?5:g==="не зачтено"?2:(+g||null);
function caseScore(M, lec, k){ const l=lecById(lec); const s=(M.cases.get(lec)||new Map()).get(k); if(!s||!l||!l.cases) return null; const ok=Object.values(s.ans).filter(a=>a.ok).length; return {ok, n:Object.keys(s.ans).length, total:l.cases.length}; }
function studentsFiltered(M, group, lecs){
  let arr = [...M.students.values()];
  if(group) arr = arr.filter(s=>s.group===group);
  if(lecs) arr = arr.filter(s=>lecs.some(id=>(M.present.get(id)||new Map()).has(s.k) || M.workOf.has(id+"|practice|"+s.k) || M.workOf.has(id+"|lab|"+s.k)));
  return arr.sort((a,b)=>a.group.localeCompare(b.group,"ru")||a.name.localeCompare(b.name,"ru"));
}

    (API.mode==="server"?'<button class="btn sm" id="tRe">'+ico("refresh-cw")+' Обновить</button>':'')+
    '<button class="btn sm" onclick="window.print()">'+ico("printer")+' Печать</button><button class="btn sm" id="tCsv">'+ico("download")+' CSV (Excel)</button><a class="btn sm" href="#/">⌂ Курс</a>'+(API.mode==="server"?'<button class="btn sm" id="tOut">Выйти</button>':'')+'</div></div>'+
    '<div class="tabs">'+tabs.map(t=>'<button data-tt="'+t[0]+'" class="'+(T.tab===t[0]?"on":"")+'">'+ico(t[2])+t[1]+(t[0]==="works"&&unchecked?' <span class="badge warn">'+unchecked+'</span>':'')+'</button>').join("")+'</div>'+

  const re=$("#tRe"); if(re) re.onclick=async()=>{ re.disabled=true; try{ await loadTeacher(); }catch(e){ alert(e.message); } renderTeacher(); };
  const out=$("#tOut"); if(out) out.onclick=()=>{ T.key=""; T.model=null; ss("yap.tkey",null); showTeacher(); };
  $("#tCsv").onclick=()=>{ const t=$("#tBody table.tt[data-csv]")||$("#tBody table.tt"); if(t) downloadCsv(t, (t.dataset.csv||"tablica")+".csv"); else alert("На этой вкладке нет таблицы для выгрузки."); };
  ({lesson:tLesson, sem:tSem, works:tWorks, about:tAbout})[T.tab]();

function saveF(){ ls("yap.tf", T.f); }
function lecOptions(sel, withAll){ return (withAll?'<option value="">Все лекции</option>':'')+LECTURES.filter(l=>l.sem>0||l.cases).map(l=>'<option value="'+l.id+'"'+(l.id===sel?" selected":"")+'>'+lecShort(l)+' · '+esc(l.title)+'</option>').join(""); }
function groupOptions(sel){ return '<option value="">Все группы</option>'+[...T.model.groups].sort().map(g=>'<option'+(g===sel?" selected":"")+'>'+esc(g)+'</option>').join(""); }
function downloadCsv(table, fname){
  const rows = [...table.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/\s+/g," ").trim().replace(/"/g,'""')+'"').join(";"));
  const blob = new Blob(["﻿"+rows.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function bar(p){ return '<span class="barcell"><i style="width:'+Math.round(p*80)+'px;background:'+(p>=.75?"var(--ok)":p>=.5?"var(--warn)":"var(--bad)")+'"></i>'+Math.round(p*100)+'%</span>'; }
function gradeBadge(g){ if(!g) return '<span class="badge warn">не проверено</span>'; const n=gradeNum(g.grade); return '<span class="badge '+(n>=4?"ok":n>=3?"warn":"bad")+'">'+esc(g.grade)+'</span>'; }

/* ---------- вкладка «Занятие» ---------- */
function tLesson(){
  const M = T.model, f = T.f; const lecs = LECTURES.filter(l=>l.sem>0);
  if(!f.lec){ const withData = lecs.filter(l=>M.present.has(l.id)); f.lec = (withData.pop()||lecs[0]).id; }
  const l = lecById(f.lec), pr = M.present.get(l.id)||new Map();
  const days = [...new Set([...pr.values()].map(fmtDay))];
  let list = studentsFiltered(M, f.group, [l.id]);
  if(f.day) list = list.filter(s=>fmtDay(pr.get(s.k))===f.day);
  const nCases = (l.cases||[]).length;
  const rows = list.map((s,i)=>{
    const cs = caseScore(M, l.id, s.k), wp = M.workOf.get(l.id+"|practice|"+s.k), wl = M.workOf.get(l.id+"|lab|"+s.k);
    const gp = wp && M.gradeOf.get(wp.id), gl = wl && M.gradeOf.get(wl.id);
    return '<tr><td class="c">'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.group)+'</td>'+
      '<td class="c">'+(pr.has(s.k)?'<span class="y">✓</span> '+fmtDate(pr.get(s.k)):'<span class="nn">—</span>')+'</td>'+
      '<td class="c">'+(cs?cs.ok+'/'+cs.total+(cs.n<cs.total?' <small>(ответил '+cs.n+')</small>':''):'—')+'</td>'+
      '<td class="c">'+(cs?bar(cs.ok/cs.total):'')+'</td>'+
      '<td class="c">'+(wp?(wp.auto?wp.auto.score+'/'+wp.auto.total+' ':'')+gradeBadge(gp)+(wp.team?'<br><small>команда «'+esc(wp.team)+'»</small>':''):'—')+'</td>'+
      '<td class="c">'+(wl?(wl.auto?'тесты '+wl.auto.passed+'/'+wl.auto.total+' ':'')+gradeBadge(gl)+'<br><small>'+esc(LANGS[wl.lang]?LANGS[wl.lang].name:wl.lang)+(wl.team?' · «'+esc(wl.team)+'»':'')+'</small>':'—')+'</td></tr>';
  }).join("");
  // статистика по кейсам
  const cm = M.cases.get(l.id)||new Map();
  const cstats = (l.cases||[]).map((c,i)=>{ let n=0, ok=0; const wrong={}; for(const [k,s] of cm){ if(f.group && !k.endsWith("|"+f.group)) continue; const a=s.ans[i]; if(!a) continue; n++; if(a.ok) ok++; else if(c.type==="mc") wrong[a.v]=(wrong[a.v]||0)+1; }
    const top = Object.entries(wrong).sort((a,b)=>b[1]-a[1])[0];
    return '<tr><td class="c">'+(i+1)+'</td><td>'+md(c.q)+'</td><td class="c">'+n+'</td><td>'+(n?bar(ok/n):'—')+'</td><td>'+(top?'«'+esc(LETTERS[top[0]])+'» — '+md(c.o[top[0]])+' ('+top[1]+')':'')+'</td></tr>'; }).join("");
  const present = list.filter(s=>pr.has(s.k)).length;
  const allCs = list.map(s=>caseScore(M,l.id,s.k)).filter(Boolean);
  const avg = allCs.length ? allCs.reduce((a,c)=>a+c.ok/c.total,0)/allCs.length : 0;
  const np = list.filter(s=>M.workOf.has(l.id+"|practice|"+s.k)).length, nl = list.filter(s=>M.workOf.has(l.id+"|lab|"+s.k)).length;
  $("#tBody").innerHTML = '<div class="t-filters"><label>Лекция<select id="fLec">'+lecOptions(f.lec)+'</select></label><label>Группа<select id="fGr">'+groupOptions(f.group)+'</select></label>'+
    '<label>Дата<select id="fDay"><option value="">Все даты</option>'+days.map(d=>'<option'+(d===f.day?" selected":"")+'>'+d+'</option>').join("")+'</select></label></div>'+
    '<div class="print-only"><h2>'+esc(lecLabel(l))+'. '+esc(l.title)+'</h2><p>'+(f.group?'Группа '+esc(f.group)+' · ':'')+(f.day?'Дата '+esc(f.day)+' · ':'')+'Сформировано '+new Date().toLocaleString("ru-RU")+'</p></div>'+
    '<div class="t-kpis"><div class="t-kpi"><div class="v">'+present+'</div><div class="l">присутствовали</div></div><div class="t-kpi"><div class="v">'+Math.round(avg*100)+'%</div><div class="l">средний результат кейсов</div></div>'+
    '<div class="t-kpi"><div class="v">'+np+'</div><div class="l">сдали практическую</div></div><div class="t-kpi"><div class="v">'+nl+'</div><div class="l">сдали лабораторную</div></div></div>'+
    '<div class="t-card"><h2>Посещаемость и результаты</h2><div class="tscroll"><table class="tt" data-csv="zanyatie-'+l.id+'"><tr><th class="c">№</th><th>ФИО</th><th>Группа</th><th class="c">Присутствие</th><th class="c">Кейсы</th><th class="c">%</th><th class="c">Практика</th><th class="c">Лабораторная</th></tr>'+(rows||'<tr><td colspan="8">Нет данных по этой лекции.</td></tr>')+'</table></div></div>'+
    (nCases?'<div class="t-card"><h2>Правильность ответов по кейсам</h2><div class="tscroll"><table class="tt" data-csv="keysy-'+l.id+'"><tr><th class="c">№</th><th>Кейс</th><th class="c">Ответили</th><th>Верно</th><th>Самый частый неверный ответ</th></tr>'+cstats+'</table></div></div>':'');
  $("#fLec").onchange=e=>{ f.lec=e.target.value; f.day=""; saveF(); tLesson(); };
  $("#fGr").onchange=e=>{ f.group=e.target.value; saveF(); tLesson(); };
  $("#fDay").onchange=e=>{ f.day=e.target.value; saveF(); tLesson(); };
}

/* ---------- вкладка «Семестр» ---------- */
function tSem(){
  const M = T.model, f = T.f; const sem = +(f.sem||1);
  const lecs = LECTURES.filter(l=>l.sem===sem).sort((a,b)=>a.n-b.n), ids = lecs.map(l=>l.id);
  const list = studentsFiltered(M, f.group, ids);
  const held = lecs.filter(l=>M.present.has(l.id)).length || 0;
  const rows = list.map((s,i)=>{
    let att=0, csum=0, cn=0, pg=[], lg=[], ps=0, lsb=0;
    const cells = lecs.map(l=>{
      const here = (M.present.get(l.id)||new Map()).has(s.k); if(here) att++;
      const cs = caseScore(M, l.id, s.k); if(cs){ csum+=cs.ok/cs.total; cn++; }
      const wp=M.workOf.get(l.id+"|practice|"+s.k), wl=M.workOf.get(l.id+"|lab|"+s.k);
      if(wp){ ps++; const g=M.gradeOf.get(wp.id); if(g&&gradeNum(g.grade)) pg.push(gradeNum(g.grade)); }
      if(wl){ lsb++; const g=M.gradeOf.get(wl.id); if(g&&gradeNum(g.grade)) lg.push(gradeNum(g.grade)); }
      const t = (here?"был":"не был")+(cs?", кейсы "+cs.ok+"/"+cs.total:"")+(wp?", практика":"")+(wl?", лаба":"");
      return '<td class="c" title="'+esc(l.title+": "+t)+'">'+(here?'<span class="y">✓</span>':'<span class="nn">·</span>')+(cs?'<br><small>'+Math.round(cs.ok/cs.total*100)+'%</small>':'')+(wp||wl?'<br><small>'+(wp?"П":"")+(wl?"Л":"")+'</small>':'')+'</td>';
    }).join("");
    const avg = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length).toFixed(1).replace(".",",") : "—";
    return '<tr><td class="c">'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.group)+'</td>'+cells+
      '<td class="c"><b>'+att+'</b>/'+(held||lecs.length)+'</td><td class="c">'+(held?Math.round(att/held*100)+'%':'—')+'</td><td class="c">'+(cn?Math.round(csum/cn*100)+'%':'—')+'</td>'+
      '<td class="c">'+ps+' · '+avg(pg)+'</td><td class="c">'+lsb+' · '+avg(lg)+'</td></tr>';
  }).join("");
  // итог по лекциям
  const foot = '<tr><td></td><td><b>Присутствовало</b></td><td></td>'+lecs.map(l=>'<td class="c"><b>'+list.filter(s=>(M.present.get(l.id)||new Map()).has(s.k)).length+'</b></td>').join("")+'<td colspan="5"></td></tr>';
  $("#tBody").innerHTML = '<div class="t-filters"><label>Семестр<select id="fSem"><option value="1"'+(sem===1?" selected":"")+'>Семестр 1</option><option value="2"'+(sem===2?" selected":"")+'>Семестр 2</option></select></label><label>Группа<select id="fGr">'+groupOptions(f.group)+'</select></label></div>'+
    '<div class="print-only"><h2>Сводная ведомость · семестр '+sem+(f.group?' · группа '+esc(f.group):'')+'</h2><p>Сформировано '+new Date().toLocaleString("ru-RU")+'. ✓ — присутствие, % — результат кейсов, П/Л — сданы практическая/лабораторная.</p></div>'+
    '<div class="t-kpis"><div class="t-kpi"><div class="v">'+list.length+'</div><div class="l">студентов с активностью</div></div><div class="t-kpi"><div class="v">'+held+' / '+lecs.length+'</div><div class="l">проведено лекций (есть отметки)</div></div></div>'+
    '<div class="t-card"><h2>Посещаемость и успеваемость за семестр</h2><p class="no-print" style="color:var(--muted);font-size:13px;margin:0 0 8px">✓ — был на лекции · % — результат кейсов · П / Л — сданы практическая / лабораторная · в столбцах «Практика» и «Лаба»: сдано · средняя оценка</p>'+
    '<div class="tscroll"><table class="tt" data-csv="semestr-'+sem+'"><tr><th class="c">№</th><th>ФИО</th><th>Группа</th>'+lecs.map(l=>'<th class="c" title="'+esc(l.title)+'">Л'+l.n+'</th>').join("")+'<th class="c">Посещ.</th><th class="c">%</th><th class="c">Кейсы</th><th class="c">Практика</th><th class="c">Лаба</th></tr>'+(rows||'<tr><td colspan="'+(lecs.length+8)+'">Нет данных.</td></tr>')+(rows?foot:'')+'</table></div></div>';
  $("#fSem").onchange=e=>{ f.sem=e.target.value; saveF(); tSem(); };
  $("#fGr").onchange=e=>{ f.group=e.target.value; saveF(); tSem(); };
}

/* ---------- вкладка «Проверка работ» ---------- */
function tWorks(){
  const M = T.model, f = T.f;
  let ws = M.lastWorks.slice().sort((a,b)=>(b.t||b.ct)-(a.t||a.ct));
  if(f.wlec) ws = ws.filter(w=>w.lecture===f.wlec);
  if(f.wkind) ws = ws.filter(w=>w.kind===f.wkind);
  if(f.group) ws = ws.filter(w=>normGroup(w.group)===f.group);
  if(f.wst==="todo") ws = ws.filter(w=>!M.gradeOf.get(w.id)); else if(f.wst==="done") ws = ws.filter(w=>M.gradeOf.get(w.id));
  if(!T.sel || !ws.find(w=>w.id===T.sel)) T.sel = ws[0] && ws[0].id;
  $("#tBody").innerHTML = '<div class="t-filters"><label>Лекция<select id="fWL">'+lecOptions(f.wlec, true)+'</select></label><label>Тип<select id="fWK"><option value="">Все работы</option><option value="practice"'+(f.wkind==="practice"?" selected":"")+'>Практические</option><option value="lab"'+(f.wkind==="lab"?" selected":"")+'>Лабораторные</option></select></label>'+
    '<label>Статус<select id="fWS"><option value="">Все</option><option value="todo"'+(f.wst==="todo"?" selected":"")+'>Не проверены</option><option value="done"'+(f.wst==="done"?" selected":"")+'>Проверены</option></select></label><label>Группа<select id="fGr">'+groupOptions(f.group)+'</select></label></div>'+
    '<div class="t-split"><div class="wl no-print">'+(ws.length?ws.map(w=>{ const l=lecById(w.lecture), g=M.gradeOf.get(w.id);
      return '<button data-w="'+esc(w.id)+'" class="'+(w.id===T.sel?"on":"")+'"><b>'+esc(w.team?"Команда «"+w.team+"»":w.name)+'</b> · '+esc(w.group)+'<br><small>'+(l?lecShort(l):w.lecture)+' · '+(w.kind==="lab"?"лабораторная":"практическая")+' · '+fmtDate(w.t||w.ct)+(w.attempt>1?' · попытка '+w.attempt:'')+'</small><br>'+
        (w.kind==="lab"&&w.auto?'<span class="badge '+(w.auto.passed===w.auto.total?"ok":"bad")+'">тесты '+w.auto.passed+'/'+w.auto.total+'</span> ':'')+(w.kind==="practice"&&w.auto?'<span class="badge">авто '+w.auto.score+'/'+w.auto.total+'</span> ':'')+gradeBadge(g)+'</button>'; }).join(""):'<p>Нет работ по выбранным условиям.</p>')+'</div>'+
    '<div id="wDet"></div></div>';
  $("#fWL").onchange=e=>{ f.wlec=e.target.value; saveF(); tWorks(); };
  $("#fWK").onchange=e=>{ f.wkind=e.target.value; saveF(); tWorks(); };
  $("#fWS").onchange=e=>{ f.wst=e.target.value; saveF(); tWorks(); };
  $("#fGr").onchange=e=>{ f.group=e.target.value; saveF(); tWorks(); };
  $$(".wl [data-w]").forEach(b=>b.onclick=()=>{ T.sel=b.dataset.w; $$(".wl [data-w]").forEach(x=>x.classList.toggle("on",x===b)); workDetail(); });
  workDetail();
}
function workDetail(){
  const M = T.model, box = $("#wDet"); const w = M.lastWorks.find(x=>x.id===T.sel);
  if(!w){ box.innerHTML = ""; return; }
  const l = lecById(w.lecture), g = M.gradeOf.get(w.id);
  let body = "";
  if(w.kind==="practice" && l && l.practice){
    body = l.practice.tasks.map((c,i)=>{ const a=(w.answers||[])[i];
      let ans;
      if(c.type==="open") ans = a&&a.open ? '<div class="fb info" style="white-space:pre-wrap">'+esc(a.open)+'</div>' : '<span class="nn">нет ответа</span>';
      else if(!a) ans = '<span class="nn">не выполнено</span>';
      else { let shown = a.v;
        if(c.type==="mc") shown = LETTERS[a.v]+") "+c.o[a.v]; else if(c.type==="multi") shown = a.v.map(j=>LETTERS[j]).join(", ");
        else if(c.type==="order") shown = a.v.map(j=>c.items[j]).join(" → "); else if(c.type==="match") shown = a.v.map((k,j)=>c.pairs[j][0]+" — "+c.pairs[k][1]).join("; ");
        ans = '<span class="'+(a.ok?"y":"nn")+'">'+(a.ok?"✓ ":"✗ ")+'</span>'+esc(shown); }
      return '<div style="margin:10px 0"><b>'+(i+1)+'. '+md(c.q)+'</b><div>'+ans+'</div></div>'; }).join("");
  } else if(w.kind==="lab" && l && l.lab){
    const lab = l.lab, vi = w.variant ?? labVariantIndex(lab, w.seed||""), v = lab.variants[vi];
    body = '<p><b>Вариант '+(vi+1)+':</b> '+md(labText(lab, v))+'</p><p><b>Язык:</b> '+esc(LANGS[w.lang]?LANGS[w.lang].name:w.lang)+' · <b>автотесты при сдаче:</b> '+(w.auto?w.auto.passed+'/'+w.auto.total:'—')+'</p>'+
      (w.static&&w.static.length?'<div class="fb poor">'+w.static.map(esc).join("<br>")+'</div>':'')+
      '<pre class="p-code" style="max-height:480px">'+hl(w.code||"")+'</pre><div class="p-actions no-print"><button class="btn" id="wRerun">'+ico("play")+' Перепроверить тесты здесь</button></div><div id="wRes"></div>';
  }
  box.innerHTML = '<div class="t-card"><h2>'+esc(w.kind==="lab"?"Лабораторная":"Практическая")+' · '+(l?esc(lecShort(l)+" "+l.title):esc(w.lecture))+'</h2>'+
    '<p><b>'+(w.team?'Команда «'+esc(w.team)+'»: ':'')+esc((w.members||[w.name]).join(", "))+'</b> · '+esc(w.group)+' · сдано '+fmtDate(w.t||w.ct)+(w.attempt>1?' · попытка '+w.attempt:'')+'</p>'+body+
    '<div class="t-card no-print" style="background:var(--surface2)"><h2>Оценка</h2><div class="seg" id="gSeg">'+GRADES.map(x=>'<button data-g="'+esc(x)+'" class="'+(g&&g.grade===x?"on":"")+'">'+esc(x)+'</button>').join("")+'</div>'+
    '<div style="height:8px"></div><textarea class="p-in" id="gCom" placeholder="Комментарий студенту (увидит в «Мои результаты»)" style="min-height:70px">'+esc(g?g.comment||"":"")+'</textarea>'+
    '<div class="p-actions"><button class="btn primary" id="gSave"'+(API.mode==="server"?"":" disabled")+'>Сохранить оценку</button>'+(g?'<span class="badge ok">сохранено '+fmtDate(g.t)+'</span>':'')+(API.mode==="server"?'':'<span class="badge">только просмотр: нет сервера</span>')+'</div></div></div>';
  let pick = g ? g.grade : null;
  $$("#gSeg button").forEach(b=>b.onclick=()=>{ pick=b.dataset.g; $$("#gSeg button").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#gSave").onclick = async ()=>{
    if(!pick){ alert("Выберите оценку."); return; }
    try{ const r = await API.req("POST","teacher/grade",{ref:w.id, grade:pick, comment:$("#gCom").value.trim(), lecture:w.lecture, kind:w.kind}, T.key);
      T.grades.push(r.grade); M.gradeOf.set(w.id, r.grade); tWorks(); }catch(e){ alert("Не удалось сохранить: "+e.message); }
  };
  const rr = $("#wRerun"); if(rr) rr.onclick = async ()=>{ rr.disabled=true; const lab=l.lab, vi=w.variant ?? labVariantIndex(lab, w.seed||"");
    $("#wRes").innerHTML='<div class="fb info">Выполняю…</div>';
    const res = await checkLab(lab, lab.variants[vi], w.lang, w.code||"", s=>{ $("#wRes").innerHTML='<div class="fb info">'+esc(s)+'</div>'; });
    $("#wRes").innerHTML = '<div class="fb '+(res.passed===res.total?"good":"poor")+'">Перепроверка: '+res.passed+' из '+res.total+(w.auto&&w.auto.passed!==res.passed?' · <b>не совпадает с результатом при сдаче ('+w.auto.passed+')</b>':'')+'</div>'+testsTable(res); rr.disabled=false; };
}

/* ---------- вкладка «Данные» ---------- */
function tAbout(){
  const M = T.model, kinds = {};
  T.events.forEach(e=>kinds[e.kind]=(kinds[e.kind]||0)+1);
  $("#tBody").innerHTML = '<div class="t-card"><h2>Где хранятся результаты</h2><p>Сервер записывает каждое действие студента отдельной строкой в текстовые файлы папки <code>data</code> рядом с <code>server.py</code>:</p>'+
    '<table class="tt"><tr><th>Файл</th><th>Что внутри</th></tr><tr><td><code>data/events.jsonl</code></td><td>отметки присутствия, ответы на кейсы, сданные практические и лабораторные (с кодом)</td></tr><tr><td><code>data/grades.jsonl</code></td><td>оценки и комментарии преподавателя</td></tr><tr><td><code>data/teacher_key.txt</code></td><td>ключ входа в этот портал</td></tr></table>'+
    '<p>Файлы можно копировать, архивировать и открыть позже: вкладка «Вход» → выбрать файлы. Таблицы выгружаются кнопкой «CSV (Excel)» и печатаются кнопкой «Печать».</p></div>'+
    '<div class="t-kpis">'+[["студентов",M.students.size],["групп",M.groups.size],["событий",T.events.length],["отметок присутствия",kinds.checkin||0],["ответов на кейсы",kinds.case||0],["практических",kinds.practice||0],["лабораторных",kinds.lab||0],["оценок",T.grades.length]].map(x=>'<div class="t-kpi"><div class="v">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>').join("")+'</div>'+
    (T.info&&T.info.urls?'<div class="t-card"><h2>Адреса для студентов</h2><p>'+T.info.urls.map(u=>'<code>'+esc(u)+'</code>').join(" · ")+'</p></div>':'');
}

"use strict";
/* ======================= КАРТА КУРСА ======================= */
function showHome(){
  cur = {l:null, slides:[], i:0};
  showOnly("home"); closeOv();
  document.title = "Языки программирования — курс";
  const intro = LECTURES.filter(l=>l.sem===0);
  const srv = API.mode==="server", urls = (API.info&&API.info.urls)||[];
  const h = $("#home");
  h.innerHTML = '<div class="hero"><div><h1>Языки программирования<br>Технологии и методы программирования</h1><p>Интерактивный курс на 2 семестра: 36 лекций, 36 практических и 36 лабораторных работ, портал кейсов по QR-коду для 120–180 студентов, аналитика посещаемости и успеваемости. '+esc(settings.author)+'.</p></div>'+
    '<div class="actions"><button class="btn primary" data-go="#p">'+ico("smartphone")+' Портал студента</button><button class="btn" data-go="#t">'+ico("graduation-cap")+' Портал преподавателя</button><button class="btn" id="hSet">'+ico("settings")+' Настройки</button><button class="btn" id="hTh">◐</button></div></div>'+
    (srv ? '<div class="note-box okbox" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="qr-box" style="padding:10px">'+qrHtml("",150)+'</div><div><b style="color:var(--ok)">● Сервер преподавателя работает.</b> Результаты студентов сохраняются в текстовые файлы на этом компьютере.<br>Адрес для студентов в этой Wi-Fi-сети: '+(urls.length?urls.map(u=>'<code>'+esc(u)+'</code>').join(" или "):'<code>'+esc(siteBase())+'</code>')+'<br>Вход в портал преподавателя — по ключу из окна сервера.</div></div>'
         : '<div class="note-box"><b>Режим без сервера.</b> Слайды, кейсы и лабораторные работают, но результаты студентов остаются на их телефонах. Чтобы собирать результаты, посещаемость и сданные работы, запустите на своём ноутбуке <code>server.py</code> (файлы <code>start-mac.command</code> / <code>start-windows.bat</code>) и откройте адрес, который он покажет.</div>')+
    (intro.length?'<div class="sem"><h2>Для лектора и студентов</h2><div class="grid">'+intro.map(tile).join("")+'</div></div>':'')+
    COURSE.sems.map(s=>'<div class="sem"><h2>'+esc(s.title)+'</h2><p class="meta">'+esc(s.meta)+'</p><div class="grid">'+LECTURES.filter(l=>l.sem===s.n).sort((a,b)=>a.n-b.n).map(tile).join("")+'</div></div>').join("")+
    '<div class="note-box">Управление на лекции: ← → — слайды, <kbd>Q</kbd> — QR, <kbd>T</kbd> — таймер, <kbd>R</kbd> — случайный студент, <kbd>N</kbd> — заметки, <kbd>?</kbd> — все клавиши. Каждая лекция: титул → план с QR → содержание с вопросами аудитории → кейсы → практика и лабораторная → итоги.</div>';
  mountQR(h);
  h.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
  $("#hSet").onclick=openSettings; $("#hTh").onclick=toggleTheme;
  function tile(l){ const n = buildSlides(l).length;
    return '<button class="tile" data-go="#/'+l.id+'/1"><span class="no">'+(l.sem===0?"00":"Л"+String(l.n).padStart(2,"0"))+'</span>'+(l.isNew?'<span class="tag new">новое</span>':l.upd?'<span class="tag">обновлено</span>':'')+
      '<div class="tt">'+esc(l.title)+'</div><div class="ds">'+esc(l.short||l.sub||"")+'</div><span class="icons">'+(l.icons||[]).slice(0,4).map(i=>ico(i)).join("")+'</span><span class="cnt">'+n+' сл.'+(l.lab?' · П+Л':'')+'</span></button>'; }
}

/* ======================= РОУТИНГ И ЗАПУСК ======================= */
function route(){
  const h = decodeURIComponent(location.hash||"");
  let m;
  if((m = h.match(/^#p(?:\/(.*))?$/))) return showPortal(m[1]||"");
  if((m = h.match(/^#t(?:\/(\w+))?$/))) return showTeacher(m[1]);
  if((m = h.match(/^#\/([^/]+)(?:\/(\d+))?$/))) return showDeck(m[1], (+m[2]||1)-1);
  showHome();
}
PENDING.forEach(f=>f()); PENDING.length = 0;
LECTURES.forEach(l=>{ if(l.lab) l.lab._id = l.id+":lab"; });
addEventListener("hashchange", route);
API.init().finally(route);

</script>
